# Signed ingest manifests that record a path on the machine that built them,
# grandfathered until they are scrubbed and signed again (axiom-corpus#896).
#
# A signed manifest is public and records how anyone can rebuild its scope. A
# path such as /Users/<name>/..., /private/tmp/... or ~/... reaches no one
# else and publishes the operator's directory layout. sign-ingest-manifest
# records paths inside the checkout repository-relative and refuses any other
# (axiom_corpus.corpus.ingest_manifests.recordable_command), and
# sign_ingest_manifest refuses a manifest that records one in any field.
#
# tests/test_ingest_manifest_local_paths.py fails when a manifest under
# .axiom/ingest-manifests/ records a local path in any string field and is not
# listed here. This list only shrinks:
# - each entry pins the manifest's bytes (sha256 of the file) and the fields
#   that hold the paths, so a manifest that changes must lose its paths and
#   its entry together;
# - an entry whose manifest no longer records a local path fails as stale;
# - an entry whose (path, sha256) is not one grandfathered on 2026-10-20
#   (GRANDFATHERED in the test) fails, so no entry can be added.
#
# Scrubbing re-signs the manifest, which needs the corpus ingest key: the
# hub's to do; agents never read the key. For each scope: fetch it
# (`axiom-corpus-ingest corpus fetch <jurisdiction>/<class>/<version>`), sign
# it with `sign-ingest-manifest --jurisdiction ... --document-class ...
# --version ... --command '<scrubbed text>' --output data/resign/<name>.json`,
# passing each of the old manifest's reasoning_logs as --reasoning-log, and
# check that the new applied_files equal the old ones, so that only
# command.text, generated_at, the signer commit and the signature change.
# Sign all of them before moving any into place: the signer refuses a dirty
# tracked tree, so overwriting one tracked manifest stops the next signing.
# scripts/sign_release_scopes.sh keeps any manifest that exists and writes its
# own command text, so it cannot do this. Merge commits only; never rebase
# signed manifests.

