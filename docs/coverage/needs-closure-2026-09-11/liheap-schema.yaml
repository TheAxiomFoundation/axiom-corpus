program: liheap
title: LIHEAP (federal block grant and state FY2026 plans)
date: '2026-09-11'
method: 'Law-derived: one element per statute section, CFR subpart/section, POMS/IOM subchapter or chapter, annual notice family, and state plan
  section / state rule family. PolicyEngine-US (policyengine_us/parameters and variables, walked 2026-09-11) and rulespec-us are cross-checks
  only: pe_modeled = yes/partial/no per element.'
sources:
- 42 U.S.C. 8621-8630
- 45 CFR 96 subpart H (96.80-96.89)
- LIHEAP Detailed Model Plan sections 1-20 (structure read from the extracted plans)
- ACF LIHEAP Clearinghouse index https://liheapch.acf.gov/stateplans.htm read 2026-09-11 (plans, policy manuals, delegation letters)
- manifests/liheap-agent-queue.yaml and run note 2026-09-10-liheap-state-plans-fy2026
- 'cross-check: policyengine_us gov/hhs/liheap (1 leaf: smi_limit) and gov/states/{dc,il,ma}/.../liheap, gov/states/tx/tdhca/ceap; rulespec-us
  has no LIHEAP encoding'
uncertainties:
- The plan's yes/no check boxes (categorical eligibility, asset test, priority groups, gross/net income, income types) are not captured by the
  PDF text extraction; those elements are REVIEW unless the narrative fields carry the answer.
- Benefit matrices and the policy manual are plan attachments that the clearinghouse PDF does not include; the matrix element is EXTRACTABLE only
  via the state manual link.
- Sections 18-20 (certifications) are not elements; Section 20 also absorbs the assurances page.
- Tribal and territory plans (AS, GU, MP, PR extracted) are outside the 50+DC matrix.
element_count: 41
