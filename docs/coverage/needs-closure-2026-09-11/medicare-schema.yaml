program: medicare
title: Medicare (federal Parts A, B, D and state Medicare Savings Programs)
date: '2026-09-11'
method: 'Law-derived: one element per statute section, CFR subpart/section, POMS/IOM subchapter or chapter, annual notice family, and state plan
  section / state rule family. PolicyEngine-US (policyengine_us/parameters and variables, walked 2026-09-11) and rulespec-us are cross-checks
  only: pe_modeled = yes/partial/no per element.'
sources:
- 42 U.S.C. 426, 1395c-1395w-114 (subchapter XVIII eligibility, premium and cost-sharing sections)
- 42 U.S.C. 1396a(a)(10)(E), 1396d(p), 1396u-3
- 42 CFR 406, 407, 408, 423 (subparts B, D, P), 435
- CMS IOM index (25 publications) and the four held publications
- POMS part HI chapter list
- manifests/medicare-agent-queue.yaml, run notes 2026-09-10-medicare-cms-iom-100-01/-100-24, 2026-09-11-medicare-cms-iom-100-02-100-04
- 'state MSP rules: the selected Medicaid eligibility scopes (manifests/medicaid-agent-queue.yaml)'
- 'cross-check: policyengine_us gov/hhs/medicare (26 leaves incl. savings_programs) and variables; rulespec-us us/policies/cms/original-medicare-part-a-b.yaml,
  us/statutes/42/426, 42/1396a'
uncertainties:
- Subchapter XVIII was reduced to the eligibility/premium/cost-sharing sections; payment-system sections (1395ww etc.) are out of scope for a
  household encoding.
- Part C (Medicare Advantage) is represented by two statute sections and Pub 100-16 only.
- The state MSP scan is keyword-based over the selected Medicaid scopes; PRESENT for MED-ST-2/3/4/6/7 means a row was found with the term near
  the relevant text, not that the row was read end to end.
- States that set MSP standards in an annual standards chart outside the manual (many) will show MED-ST-7 as REVIEW even when the manual is complete.
element_count: 68
