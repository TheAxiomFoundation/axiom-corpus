notes:
- Federal statute elements are the 19 subsections of 42 USC 1786 (a)-(s); the section is in no corpus scope, so every one is EXTRACTABLE from uscode.house.gov.
- Federal regulation elements are the 30 sections of 7 CFR 246 plus 25 participant-facing paragraph elements (246.7, 246.10, 246.12, 246.4, 246.9, 246.11, 246.16a). The scope us/regulation/2026-07-13-recovery-r2026-07-17-dedup
  is paragraph-granular only for 246.7 (231 paragraph rows); 246.4, 246.10 and 246.12 are single section bodies, so their paragraph elements are checked by keyword over the section body.
- 'Schema uncertainty: 246.10(e) food packages I-VII are one element although each package''s maximum monthly allowance is a distinct fact; 246.12 vendor management (g)-(l) is one element although it carries
  dozens of facts an encoder of vendor rules would need. The bar for a household-facing WIC encoding is 246.7 + 246.10 + the state''s income guidelines and food list; vendor and local-agency elements are
  recorded for completeness.'
- 'State elements: 31, of which 29 are checked by regex over the state''s WIC policy manual scope (single_block per policy PDF, so a match cites the policy). Only 21 states have a manual scope; the other
  30 inherit the queue''s classification (OUTREACH for the 10 access/login blocks, ABSENT for the 20 publishers that post no manual).'
- wic_s30 (state plan) and wic_s31 (state rule chapter) have no corpus family anywhere; the queue inventoried the manual family only, so most rows are REVIEW rather than ABSENT.
- PolicyEngine models WIC as eligibility (category, 185% income test, nutritional risk flag) plus a food-package value and the CVB; everything about certification, documentation, priority, sanctions, vendors,
  nutrition education and issuance is beyond it.
