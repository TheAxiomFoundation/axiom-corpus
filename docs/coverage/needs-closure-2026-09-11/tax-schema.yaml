title: 'Needs schema: individual income tax (federal + 50 states + DC), law-derived'
date: '2026-09-11'
method:
  primary_source: 'the law''s own structure: 26 U.S.C. subtitle A chapter 1 section by section (subchapters A, B; individual-facing
    parts of D, E, F, N, O, P), chapters 2, 2A, 21, 24, 61, 65, 68, 79; 26 CFR part 1 and part 31 families; annual revenue
    procedures, notices, SSA determinations; IRS forms, schedules, instructions and publications; for each state a section-by-section
    template of its individual income tax chapter, its regulations, annual forms, rate schedules and department bulletins;
    for the nine no-broad-tax states the constitutional or statutory bar plus any wage, interest, dividend or capital-gains
    tax'
  element_definition: a fact an encoder must read (a rate, threshold, amount, definition, eligibility rule, or a whole product
    where the product is the carrier of many facts), not a topic
  federal_inheritance: federal elements appear once (jurisdiction us) and are inherited by all 51 jurisdictions
  cross_checks:
  - PolicyEngine-US parameters gov/irs, gov/states/<st>/tax, gov/local (column pe_modeled)
  - rulespec-us us/statutes/26, us/policies/irs, us-<st>/policies/income_tax and statutes (column rulespec_encoded)
  statuses:
    PRESENT: a specific provision body in a selected scope carries it (body read by regex, snippet quoted)
    EXTRACTABLE: the rule exists and the publisher lists the carrying family; not taken
    ABSENT: the rule exists but the publisher posts nothing carrying it
    OUTREACH: publisher block recorded in the queue
    REVIEW: could not tell
    N/A: the jurisdiction's law has no such rule (analyst knowledge; verify)
  uncertainty: the known-law sets in tax-check.py (state EITC, child credit, CDCC, AMT, surtax, local taxes, standard deduction,
    exemptions, capital gains, indexing, low-income relief, circuit breakers) are analyst knowledge of TY2025 law and drive
    the N/A rows; every N/A note says so. Regex evidence can miss a fact that is phrased differently (false EXTRACTABLE) or
    match a cross-reference (false PRESENT); the quoted snippet in evidence_note is the audit trail.
element_count: 206
