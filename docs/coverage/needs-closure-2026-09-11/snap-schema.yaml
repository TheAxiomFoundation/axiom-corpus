notes:
- Federal statute elements are every section of 7 USC ch. 51 (2011-2036d; 2030 and 2033 are repealed container rows) plus every subsection of 2012, 2014, 2015 and 2017 and the state-plan subsections 2020(e),(i),(s)
  and 2025(h); 2012 subsections a-i, l, n-q, s-t, v are definitional and folded into the 2012 section element.
- Federal regulation elements are every non-reserved section of 7 CFR 271-285 as listed by the eCFR structure API (current edition, read 2026-09-12) plus 54 paragraph-level elements of 7 CFR 273. The selected
  273 scopes are section-granular (273.2 is one 154 KB body), so paragraph elements are verified by keyword over the section body, not by citation path; 7 CFR 246 is paragraph-granular in its scope.
- 'Schema uncertainty: the paragraph-level split of 273 is a reviewer''s reading of the section headings, not an exhaustive paragraph list; 273.2 (application processing) and 273.7 (work provisions) each
  carry more distinct facts than the elements enumerated here.'
- 'Federal guidance elements: the FY 2026 COLA tables and income standards are read from the two-page FNS tables held in the corpus (the 165% table is on page 2 of the income standards); the full COLA memo,
  which carries the minimum benefit, is a separate document. The FY 2024 COLA memo in the corpus is excluded from the FY 2026 checks. The State Options Report is listed as a cross-check only because the
  queue policy forbids it as a source.'
- 'State elements: 61 elements grouped by carrying family. ''mandatory'' means every state''s rulebook must carry the fact (a restatement or a state-set value); optional elections (BBCE, homeless deduction,
  SMD, TBA, CAP/ESAP, RMP, drug-felony opt-out, state-funded supplements) are ABSENT when a fully inventoried rulebook carries no text for them.'
- Regex evidence is a keyword search of provision bodies; a PRESENT hit cites the provision that matched and a snippet. A hit shows the rulebook text carries the fact, not that the encoder can read the
  exact value from that row (single-block manuals such as KY, RI put a whole volume in one provision).
- Table elements (snap_s15-s18, s20) ask for the state's own applied FY 2026 table; the federal FY 2026 value is present at the federal level, so an ABSENT/EXTRACTABLE there is a provenance gap, not a missing
  fact.
