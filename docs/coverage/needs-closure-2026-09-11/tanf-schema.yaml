program: tanf
title: TANF (Temporary Assistance for Needy Families) needs schema, law-derived
date: '2026-09-11'
method: 'Elements are enumerated from the program''s own legal structure: (1) 42 U.S.C. 601-619 section by section; (2) every live section of
  45 CFR 260-265 (from the eCFR title-45 structure snapshot of 2026-09-09 retained with the part 98 scope; 128 sections); (3) the state rulebook
  structure observed in the selected state scopes (chapter tables of contents of MT, ND, VA, TN, PA, WI, MS, CA, CO, DE, IA, NE, NM, OK, SD, VT,
  ID and the combined manuals) plus the state plan requirements of 42 U.S.C. 602(a). State-level elements are the rule elements a state must set
  (state option or state-set value); each carries a ''facts'' list naming what an encoder reads. PolicyEngine''s gov/hhs/tanf and gov/states/*/…/tanf
  trees and the rulespec-us programs/us-*/tanf wrappers are a cross-check only (pe_modeled field).'
levels:
  federal: set by statute/regulation, inherited by every state; checked once at jurisdiction us
  federal_with_state_option: federal rule that a state elects or parameterizes; checked per state
  state: set entirely by the state; checked per state
