  law_basis: 42 U.S.C. 608(a)(1), 619(2) (minor child); state rulebook
  carrying_families: state regulation/manual; state TANF plan
  facts:
  - age limit for a dependent child (under 18)
  - extension to age 18 (or 19) for a full-time secondary/vocational student
  - expected-to-graduate rule and month the child ages out
  evidence_patterns:
    strong: (?:minor|dependent|eligible) child(?:ren)?[^.]{0,80}under (?:the )?age (?:of )?(?:18|19|eighteen|nineteen)|(?:minor|dependent|eligible)
      child(?:ren)?[^.]{0,80}(?:has|have|had) not (?:attained|reached) (?:age |the age of )?(?:18|19|eighteen)|(?:age|aged) (?:18|19|eighteen)[^.]{0,80}(?:full[-
      ]time student|secondary school|high school|expected to (?:graduate|complete))|under (?:the )?age (?:of )?(?:18|eighteen)[^.]{0,120}(?:full[-
      ]time student|secondary school|high school|graduat)
    weak: full[- ]time student|secondary school
  pe_modeled: yes (age_limit / minor_child / student_dependent parameters in gov/hhs/tanf and many states)
  document_element: false
