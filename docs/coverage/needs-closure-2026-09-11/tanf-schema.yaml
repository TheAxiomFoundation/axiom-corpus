  name: ACF program guidance (e.g. work verification plan instructions, FVO, data reporting)
  level: federal
  family: ACF guidance (acf.gov/ofa resource library)
  corpus_family_status: not in the corpus; the acf.gov resource library answered a non-browser client with an HTTP 202 challenge on 2026-09-10
    (queue federal row)
  pe_modeled: 'no'
state_elements:
- id: tanf-s01
  name: Assistance unit composition (who must be included; mandatory and optional members)
  level: federal_with_state_option
  law_basis: 42 U.S.C. 608(a)(1) (minor child requirement), 602(a)(1)(A)(i); 45 CFR 260.30 (family); state rulebook
  carrying_families: state regulation/manual (assistance unit chapter); state TANF plan
  facts:
  - mandatory members (parents, minor siblings and half-siblings living together)
  - optional members (e.g. stepparents, other relatives)
  - members excluded from the unit (SSI recipients, ineligible immigrants, sanctioned adults) and whether their income counts
  - 'pregnant woman with no other child: eligibility and month of eligibility'
  - one unit per household / multiple units in a home
  evidence_patterns:
    strong: assistance unit|filing unit|assistance group|need group|standard filing unit|budget(?:ary)? (?:unit|group)|mandatory (?:\w+ )?(?:household|assistance
      unit|filing unit) members|who must be included|family composition|household (?:unit|composition)|must include
    weak: household members|family members
  pe_modeled: 'partial (PE: household/spm_unit roles, max_unit_size caps; no unit-composition rules)'
  document_element: false
- id: tanf-s02
  name: Dependent child age limit and student extension
