schema_uncertainties:
- Section-level elements for 42 U.S.C. 601-619 are enumerated from the compiler's knowledge of the title (the text is not in the corpus); headings
  should be re-checked against the ingested text once extracted.
- State-level elements are a normalized cross-state list; individual states split or merge them (e.g. WI W-2 placements replace need/payment standards;
  MN MFIP has a food portion). One state element can map to several rulebook chapters, and the 'facts' lists are indicative, not exhaustive.
- Procedural elements (tanf-s25, s26, s27) are broad; a PRESENT there says the rulebook has the chapter, not that every fact is carried.
- The evidence search is pattern-based on provision bodies; PRESENT means a heading match or at least two body matches were found and cited, not
  that a human read every state's chapter. A random sample of PRESENT cells was read by hand (see tanf.md).
- Whether a state 'sets' an optional element (diversion, drug-felony modification, EBT penalties) cannot be told from absence; REVIEW is used,
  not ABSENT, unless the queue records the publisher posts nothing.
