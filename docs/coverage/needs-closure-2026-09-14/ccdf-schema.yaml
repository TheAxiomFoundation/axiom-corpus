schema_uncertainties:
- Exact section letters of 42 U.S.C. 9858d-9858m and 9858o-9858r are grouped, not enumerated one by one, because the statute text is not in the
  corpus; take the title before treating the statute rows as section-complete.
- Plan-carried elements are PRESENT when the plan subsection body carries the element's vocabulary; the plan reports values as of 2024-10-01 (or
  the taken amendment), so current-year copay and rate schedules are a separate element (ccdf-s30).
- Provider standards (ccdf-s23) are summarized by the plan; the state licensing code itself is out of scope of this check.
- The plan is a certified description of policy; whether an encoder may cite it in place of the state rule is a rules-repo decision, so ccdf-s29
  (the state rulebook) is tracked separately.
