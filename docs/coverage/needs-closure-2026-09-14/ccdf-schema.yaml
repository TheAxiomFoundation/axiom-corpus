program: ccdf
title: CCDF (Child Care and Development Fund) needs schema, law-derived
date: '2026-09-11'
method: Elements are enumerated from (1) the CCDBG Act, 42 U.S.C. 9857-9858r (section groups; text not in the corpus); (2) every live section
  of 45 CFR 98 (61 sections, eCFR structure 2026-09-09, scope us/regulation/2026-09-11-title-45-part-98); (3) the ACF-118 FFY 2025-2027 plan preprint
  structure (10 sections, 41 subsections, numbered questions such as 2.2.1-2.2.9, 3.1.1-3.3.1, 4.3.1-4.4.3, read from the Oklahoma plan bodies)
  and the state rulebooks and rate/copay schedules the run notes inventoried. State-level elements are the values and options 45 CFR 98.16 requires
  a Lead Agency to set in its plan; each carries a 'facts' list. PolicyEngine's gov/hhs/ccdf and 37 state child-care trees are a cross-check only
  (pe_modeled).
levels:
  federal: set by statute/regulation, inherited by every state; checked once at jurisdiction us
  federal_with_state_option: federal rule the Lead Agency elects or parameterizes in its plan; checked per state
  state: set entirely by the state; checked per state
