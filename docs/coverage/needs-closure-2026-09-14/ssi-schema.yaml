program: ssi
title: SSI (federal SSI and state supplements)
date: '2026-09-11'
method: 'Law-derived: one element per statute section, CFR subpart/section, POMS/IOM subchapter or chapter, annual notice family, and state plan
  section / state rule family. PolicyEngine-US (policyengine_us/parameters and variables, walked 2026-09-11) and rulespec-us are cross-checks
  only: pe_modeled = yes/partial/no per element.'
sources:
- 42 U.S.C. 1381-1383f (uscode.house.gov structure)
- 20 CFR 416 subparts A-V (eCFR structure 2026-09-09)
- POMS part SI chapter/subchapter list (run note 2026-09-10-ssi-poms-si)
- POMS SI 01415.010 state table and SI 01415.058
- manifests/ssi-agent-queue.yaml and the three state-supplement run notes
- 'cross-check: policyengine_us/parameters/gov/ssa/ssi (25 leaves) and gov/states/*/{ssp,aabd,msa,oap,ossp,sspp,state_supplement,ssi_supplement}
  (23 states); rulespec-us us/statutes/42/1382*, us/policies/ssa/poms/si-01415-058, state SSP policies (AK, AL, KS, MN, DC, DE)'
uncertainties:
- Statute elements are whole sections; an encoder may need subsection-level granularity (the held scope has it).
- POMS regional (BOS/CHI/...) sections are folded into their national subchapter element.
- State element SSI-ST-5 is marked n/a where the supplement is a flat add-on that follows SSI eligibility; that reading is the analyst's, not
  the queue's.
- Mandatory (pass-along) supplements are folded into SSI-ST-1 because SSA computes them for federally administered states; states with state-administered
  mandatory programs (AK, AZ, CO, ...) may need a separate element.
element_count: 131
