program: medicaid
date: '2026-09-11'
schema_version: 2
method: 'Elements are derived from the program''s legal structure, not from a model. (1) 42 U.S.C. 1396a and the sections it invokes (1396b(v),
  1396d, 1396o, 1396p, 1396r-5, 1396r-6, 1396u-1, 1320b-7, 1382-1382c, 8 U.S.C. 1611-1641, 1315) / 42 U.S.C. 1397aa-1397mm. (2) Every section
  of 42 CFR 435 (as held in us/regulation/2026-06-25-title-42-part-435 plus the CMS-2454-IFC 435.550-563 scope), 436 (us/regulation/2026-09-11-title-42-part-436),
  447 subpart A (eCFR structure 2026-09-09; not held) and 457 (us/regulation/2026-07-13-recovery-r2026-07-17-dedup). (3) The structure of the
  state rulebooks held in the corpus (tables of contents of the 2026-09-10 Medicaid and CHIP state scopes: definitions, application, coverage
  groups, non-financial, household/assistance unit, income, resources, MAGI and non-MAGI budgeting, LTC/HCBS post-eligibility, transfers and trusts,
  spousal impoverishment, medically needy/spend-down, MSP, presumptive and continuous eligibility, renewals and changes, notices and hearings,
  appendix income/resource tables), the approved state plan and SPAs, and annual income-level tables. PolicyEngine (policyengine-us 84253b6, 2026-08-17:
  parameters gov/hhs/medicaid, gov/hhs/chip, gov/aca, gov/states/*/hhs/chip, gov/states/{ar,va}/*/medicaid and the matching variables) and rulespec-us
  (c8951033, 2026-08-08: us-xx/policies/cms/*-chip-eligibility and *-medicaid-chip-bhp-eligibility-levels wrappers, us/policies/medicaid/magi_household_income_pipeline,
  us-ga dfcs/medicaid/2578, oracle-coverage-pending entries) are recorded per element as a cross-check in pe_modeled / rulespec.'
levels:
  federal_only: 'federal text sets the element; every state inherits it (state matrix rows: INHERITED, or NOT_APPLICABLE for part 436 which governs
    only GU/PR/VI)'
  federal_with_state_option: federal text sets the rule; the state elects or implements; the state row is checked against the state's held documents
  state: a state-set value or state-authored rule; the state row is checked; the federal row records the federal authority
search_confidence:
  high: 'search_patterns (strong) exist: a body match in the state''s program or pointer scopes is PRESENT with the matched provision (subject
    to needs_number and neg_context)'
  low: 'only weak_patterns exist: a match is a candidate and is reported REVIEW with the candidate cited'
  n/a: no text search; the cell is settled by the federal row, a CMS compilation, the state plan family or the queue row
pass_2_note: Schema version 2 (2026-09-12). Pass 1 (2026-09-11) marked PRESENT on single-word patterns and on hits in SNAP, TANF and CalFresh
  scopes; pass 2 restricts the search universe to the state's Medicaid and CHIP scopes plus the pointer scopes of done-by-pointer states, splits
  patterns into strong and weak, requires a value signal for state-set standards, rejects Medicare and ACA contexts for cost-sharing elements,
  and names the CMS-posted state plan family that carries an election when the state text does not. 42 CFR 457.344 is held only as a removal notice
  in the CMS-2454-IFC conforming-amendments scope and is not an element.
title: Medicaid needs schema (law-derived)
labels:
- medicaid
aliases:
  medicaid_chip_bhp: us manifest tag
pe_cross_check_summary: 'PolicyEngine models: MAGI groups and income limits (children by age band, pregnant + postpartum, parents/caretakers incl.
  deprivation and student options, adult group), SSI-recipient and 209(b) classification, optional aged/blind/disabled income and asset limits
  and disregards, medically needy categories and income/asset limits, MAGI household and income counting, immigration eligibility and five-year
  bar, emergency Medicaid, LTC home equity limit, community engagement (age range, hours, dependent and foster-care limits), working-disabled
  buy-in premium, 1115 MEC adult, FMAP. PolicyEngine does not model: presumptive eligibility, continuous eligibility, retroactive eligibility,
  MSP (QMB/SLMB/QI/QDWI), spousal impoverishment, transfers/look-back, trusts, estate recovery, post-eligibility treatment of income, TMA, Medicaid
  premiums and copayments (447), BCCP/TB/family-planning/HCBS/Katie Beckett groups, 1902(r)(2) methodologies, deeming, verification, renewals,
  notices, hearings, state plan content.'
element_count: 302
