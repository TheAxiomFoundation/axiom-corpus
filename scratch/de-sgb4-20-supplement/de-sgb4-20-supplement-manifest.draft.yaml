      source_note: >-
        Official consolidated Gesetze im Internet PDF, page 26 of 105,
        scoped to § 20. The two formulas in Absatz 2a are centered raster
        images and disappear from the PDF text layer. Cross-checked draft
        transcription (linearized here; each slash denotes the stacked
        fraction printed in the PDF): "BE = F × G + (2 000 / (2 000 – G) –
        G / (2 000 – G) × F) × (AE – G)" and
        "BE = 2 000 / (2 000 – G) × (AE – G)". The PDF's surrounding
        statutory text defines AE as Arbeitsentgelt, G as
        Geringfügigkeitsgrenze, and F as 28 percent divided by the applicable
        calendar-year Gesamtsozialversicherungsbeitragssatz. It prints the
        upper transition-range bound as "2 000 Euro" and the historical
        factor F = 0,7009 for 1 October through 31 December 2022. For 2025
        application, separate official BMAS material gives the range
        556,01 through 2 000 Euro and F = 0,6683; neither 2025 value is
        printed inside these symbolic equations. BMAS context:
        https://www.bmas.de/DE/Service/Presse/Pressemitteilungen/2024/das-aendert-sich-im-neuen-jahr.html
