name: Upload signed ingest corpus objects

# An ingest pull request commits signed ingest manifests and lock files; the
# bytes they pin must be in R2 before the pull request's CI can pass. This
# workflow uploads those bytes so that the ingester needs no R2 credentials
# (docs/corpus-ci-upload.md). The ingester attaches one archive to a draft
# release; a dispatcher starts this workflow on main.
#
# Trust boundary:
#   - Dispatch only, and every job requires refs/heads/main: the workflow and
#     the code it runs are main's. No pull-request code is checked out or run.
#     The pull request's lock files and manifests are read from git objects as
#     data.
#   - `stage` holds a contents: write token (GitHub shows draft releases only
#     to tokens with write access) and no R2 credentials. It copies one
#     release asset into a run artifact and never opens it.
#   - `upload` holds the R2 write credentials, in its last step only, and a
#     contents: read token. It writes an object only if a signed ingest
#     manifest that verifies against AXIOM_CORPUS_INGEST_PUBLIC_KEY, the lock
#     that equals it, and the archive's bytes all agree. Object keys come
#     from the lock's sha256. Writes are conditional, with exact readback.
#
# FOR THE REPOSITORY OWNER: create the `corpus-object-upload` environment
# before the first run, restricted to the main branch (GitHub creates a
# missing environment with no protection). Required reviewers are optional;
# `release-activation` is the one environment here that has them.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Ingest pull request number (the draft release is tagged corpus-upload-pr-<number>)"
        required: true
        type: string
      head_sha:
        description: "Full head commit of that pull request, as reviewed (gh pr view <number> --json headRefOid)"
        required: true
        type: string

concurrency:
  group: corpus-object-upload-${{ inputs.pr_number }}
  cancel-in-progress: false

permissions: {}

jobs:
  stage:
    name: Copy the staged archive (no R2 credentials)
    if: github.repository == 'TheAxiomFoundation/axiom-corpus' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      HEAD_SHA: ${{ inputs.head_sha }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]] || { echo "::error::pr_number must be a positive integer."; exit 1; }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head_sha must be 40 lowercase hex characters."; exit 1; }

      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14"

      - name: Install package
        # uv.lock's versions and hashes, the ones CI tests (docs/dependency-lock.md).
        run: bash .github/scripts/install-locked.sh --editable

      - name: List releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$RUNNER_TEMP/releases.json"

      - name: Select the one staged archive
        id: select
        run: |
          set -euo pipefail
          axiom-corpus-ingest corpus ci-select-asset \
            --releases "$RUNNER_TEMP/releases.json" \
            --pr "$PR_NUMBER" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download the archive without opening it
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ID: ${{ steps.select.outputs.asset_id }}
          ASSET_SIZE: ${{ steps.select.outputs.asset_size }}
        run: |
          set -euo pipefail
          [[ "$ASSET_ID" =~ ^[0-9]+$ ]] && [[ "$ASSET_SIZE" =~ ^[0-9]+$ ]]
          mkdir "$RUNNER_TEMP/staged"
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
            > "$RUNNER_TEMP/staged/corpus-objects.tar"
          actual="$(stat -c %s "$RUNNER_TEMP/staged/corpus-objects.tar")"
          if [ "$actual" != "$ASSET_SIZE" ]; then
            echo "::error::Downloaded $actual bytes; the selected asset has $ASSET_SIZE."
            exit 1
          fi
          {
            echo "### Staged archive"
            echo ""
            echo "- Draft release: \`corpus-upload-pr-$PR_NUMBER\`, asset $ASSET_ID, $ASSET_SIZE bytes"
            echo "- sha256: \`$(sha256sum "$RUNNER_TEMP/staged/corpus-objects.tar" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: corpus-objects
          path: ${{ runner.temp }}/staged/corpus-objects.tar
          if-no-files-found: error
          retention-days: 1

  upload:
    name: Verify against the signed lock, then upload
    needs: stage
    if: github.repository == 'TheAxiomFoundation/axiom-corpus' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: corpus-object-upload
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: "1"
      PR_NUMBER: ${{ inputs.pr_number }}
      HEAD_SHA: ${{ inputs.head_sha }}
      # A public verification key, not a secret.
      AXIOM_CORPUS_INGEST_PUBLIC_KEY: ${{ vars.AXIOM_CORPUS_INGEST_PUBLIC_KEY }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]] || { echo "::error::pr_number must be a positive integer."; exit 1; }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head_sha must be 40 lowercase hex characters."; exit 1; }
          [ -n "$AXIOM_CORPUS_INGEST_PUBLIC_KEY" ] || { echo "::error::AXIOM_CORPUS_INGEST_PUBLIC_KEY is not set."; exit 1; }

      # main, with full commit and tree history for the merge base and the
      # manifests' ancestor check. Blobs are fetched when read.
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14"

      # Dependencies are installed before any secret enters the environment.
      - name: Install package
        run: bash .github/scripts/install-locked.sh --editable

      - name: Fetch the pull request head as git objects
        # The pull request's tree is never placed in the worktree. Its lock
        # files and manifests are read with git show / cat-file.
        run: |
          set -euo pipefail
          git fetch --no-tags --filter=blob:none origin \
            "+refs/pull/${PR_NUMBER}/head:refs/corpus-upload/head"
          actual="$(git rev-parse --verify 'refs/corpus-upload/head^{commit}')"
          if [ "$actual" != "$HEAD_SHA" ]; then
            echo "::error::Pull request #$PR_NUMBER is at $actual, not the reviewed $HEAD_SHA. Review the new head and dispatch again."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: corpus-objects
          path: ${{ runner.temp }}/staged

      - name: Verify the manifests, locks and archive (no R2 credentials)
        run: |
          set -euo pipefail
          axiom-corpus-ingest corpus ci-upload \
            --base HEAD \
            --head "$HEAD_SHA" \
            --archive "$RUNNER_TEMP/staged/corpus-objects.tar" \
            --verify-only \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the verified objects to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          for var in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!var}" ]; then echo "::error::$var is not set."; exit 1; fi
          done
          # Every check runs again here, in the process that writes.
          axiom-corpus-ingest corpus ci-upload \
            --base HEAD \
            --head "$HEAD_SHA" \
            --archive "$RUNNER_TEMP/staged/corpus-objects.tar" \
            --summary "$GITHUB_STEP_SUMMARY"
