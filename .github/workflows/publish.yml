name: Publish named corpus release

# Corpus data merges are inert. Production changes only from a clean committed
# checkout when an explicit immutable selector cuts a source-complete,
# content-addressed, projection-bound, Ed25519-signed release object and the
# management plane activates it.
on:
  push:
    branches: [main, master]
    paths:
      - "manifests/releases/*.json"
  workflow_dispatch:
    inputs:
      release:
        description: "Immutable release selector name or manifests/releases/*.json path"
        required: true
        type: string

concurrency:
  group: publish-corpus-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Large union releases perform deep validation plus content-addressed R2 and
    # Supabase readback for every selected object and scope, and that work grows
    # with the whole release, not with what is new in it. A 274-scope /
    # 12,500-object release took 101 minutes serially and a 536-scope /
    # 17,000-object release was killed at the previous 120-minute limit before
    # finishing (run 34775035418). R2 staging now runs on a bounded thread pool
    # (--r2-workers) and every phase logs timestamped progress, but the ceiling
    # is GitHub's maximum so a slow R2 or Supabase day fails on a real error
    # instead of a timeout. Keep the job bounded: never remove this line.
    timeout-minutes: 360
    env:
      # Publication progress lines go to stderr; keep them ordered with stdout in
      # the Actions log so a killed run shows the phase it was in.
      PYTHONUNBUFFERED: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      AXIOM_CORPUS_RELEASE_PRIVATE_KEY: ${{ secrets.AXIOM_CORPUS_RELEASE_SIGNING_KEY }}
      AXIOM_CORPUS_RELEASE_PUBLIC_KEY: ${{ vars.AXIOM_CORPUS_RELEASE_PUBLIC_KEY }}
      AXIOM_CORPUS_RELEASE_LEGACY_PUBLIC_KEYS: ${{ vars.AXIOM_CORPUS_RELEASE_LEGACY_PUBLIC_KEYS }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14"

      - name: Install package
        run: python -I -m pip install -e .

      - name: Require the complete publication trust boundary
        run: |
          missing=0
          for var in \
            SUPABASE_ACCESS_TOKEN \
            R2_ACCESS_KEY_ID \
            R2_SECRET_ACCESS_KEY \
            AXIOM_CORPUS_RELEASE_PRIVATE_KEY \
            AXIOM_CORPUS_RELEASE_PUBLIC_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::Required publication value $var is not set."
              missing=1
            fi
          done
          [ "$missing" = "0" ]

      - name: Select immutable release cuts
        id: selectors
        env:
          DISPATCH_RELEASE: ${{ github.event.inputs.release }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf '%s\n' "$DISPATCH_RELEASE" > "$RUNNER_TEMP/release-selectors.txt"
          else
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="$HEAD^"
            fi
            git diff --name-only --diff-filter=AM "$BEFORE" "$HEAD" -- \
              'manifests/releases/*.json' > "$RUNNER_TEMP/release-selectors.txt"
          fi
          if [ ! -s "$RUNNER_TEMP/release-selectors.txt" ]; then
            echo "No added or modified immutable release selector; no publication cut."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(grep -cve '^$' "$RUNNER_TEMP/release-selectors.txt")" -ne 1 ]; then
            echo "::error::One publication run must publish exactly one named release."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/release-selectors.txt"

      - name: Ensure bounded release upload and registration
        if: steps.selectors.outputs.publish == 'true'
        run: |
          python scripts/apply_release_activation_upload_migration.py
          python scripts/apply_release_object_staging_migration.py

      - name: Validate, sign, and register the named release (activation is separate)
        if: steps.selectors.outputs.publish == 'true'
        run: |
          # Publication stages content-addressed R2 artifacts + versioned Supabase
          # rows and signs the release object. It does NOT move serving: activation
          # repoints the per-scope serving map and can displace another
          # jurisdiction's release (axiom-corpus#408), so it is a separate,
          # deliberate step run via scripts/activate_release.py (with --dry-run to
          # preview the takeover first).
          while IFS= read -r selector; do
            [ -n "$selector" ] || continue
            output="$RUNNER_TEMP/$(basename "$selector" .json)-release-object.json"
            python scripts/publish_corpus.py \
              --release "$selector" \
              --r2-workers 16 \
              --output "$output"
            mapfile -t identity < <(python - "$output" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          print(payload["release"])
          print(payload["content_sha256"])
          PY
            )
            if [ "${#identity[@]}" -ne 2 ]; then
              echo "::error::Published release object has an invalid identity."
              exit 1
            fi
            python scripts/stage_release_object.py \
              --release-object "$output" \
              --release "${identity[0]}" \
              --content-sha "${identity[1]}" \
              --expected-project-ref swocpijqqahhuwtuahwc
          done < "$RUNNER_TEMP/release-selectors.txt"

      - name: Retain the signed release object for activation
        # always(): keep the object even when registration failed after
        # publication succeeded, so the failure can be diagnosed against it.
        if: always() && steps.selectors.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: signed-corpus-release-object
          path: ${{ runner.temp }}/*-release-object.json
          if-no-files-found: error
          retention-days: 30

      - name: Publication summary
        if: always()
        run: |
          {
            echo "### Named corpus release publication (registered, not activated)"
            echo ""
            echo "The release binds the exact artifact/source inventory and canonical provision/navigation projection digests."
            echo "Conditional R2 writes, exact readback, pre-sign database evidence, and local Ed25519 verification must all pass."
            echo "The verified immutable object is registered for publication-time ordering. This step does NOT activate: serving is unchanged. Activation is a separate, deliberate step (scripts/activate_release.py, preview with --dry-run) because it repoints the per-scope serving map and can displace another jurisdiction's release (axiom-corpus#408)."
          } >> "$GITHUB_STEP_SUMMARY"
