name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Daily 12:00 UTC — catches release-coverage drift if a new
    # active named release points at navigation/provision scopes that diverge.
    - cron: "0 12 * * *"

jobs:
  workflow-lint:
    name: Validate GitHub workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      # The release binary of the version the docker://rhysd/actionlint image
      # was pinned to (sha256:b1934ee5..., tag 1.7.12), verified against its
      # published checksum: anonymous Docker Hub pulls from shared runner IPs
      # hit the pull rate limit and failed this required check.
      - name: Install actionlint 1.7.12
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint

      - name: Run actionlint
        run: '"$RUNNER_TEMP/actionlint"'

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AXIOM_CORPUS_INGEST_PUBLIC_KEY: ${{ vars.AXIOM_CORPUS_INGEST_PUBLIC_KEY }}
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Diagnose a missing ingest trust variable
        # Fork-head pull_request runs do not receive this repository's Actions
        # variable AXIOM_CORPUS_INGEST_PUBLIC_KEY, so the authentication-gate
        # tests in tests/test_state_snap_manual_queue.py (and guard-ingested,
        # when the change touches protected corpus artifacts, manifest-attested
        # reasoning logs, or the ingest manifests attesting them) fail by design
        # and fail the job. Name the cause up front. Diagnosis only: this step
        # never fails on its own; the gates below still run, and still fail,
        # exactly as before.
        if: env.AXIOM_CORPUS_INGEST_PUBLIC_KEY == ''
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CONTRIBUTING_URL: ${{ github.server_url }}/${{ github.repository }}/blob/main/CONTRIBUTING.md
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            title="Fork-head pull request run without AXIOM_CORPUS_INGEST_PUBLIC_KEY"
            body="This pull_request run comes from a fork (${HEAD_REPO:-unknown}), and fork-head runs do not receive this repository's Actions variable AXIOM_CORPUS_INGEST_PUBLIC_KEY. The authentication-gate tests in tests/test_state_snap_manual_queue.py will fail by design ('AXIOM_CORPUS_INGEST_PUBLIC_KEY is required in CI') and fail this job; guard-ingested also fails if the change touches protected corpus artifacts, manifest-attested reasoning logs, or the ingest manifests attesting them. The 'FAIL Required test coverage' line in the same log is informational, not the failure (a real coverage failure prints 'ERROR: Coverage failure'). Fix: org members have write access here, so push this branch to ${GITHUB_REPOSITORY} and open the pull request from it (see ${CONTRIBUTING_URL}). Do not weaken those tests or embed key material."
          else
            title="Same-repository run with an empty AXIOM_CORPUS_INGEST_PUBLIC_KEY"
            body="This is not a fork-head run, yet this repository's Actions variable AXIOM_CORPUS_INGEST_PUBLIC_KEY is empty, so the authentication-gate tests in tests/test_state_snap_manual_queue.py will fail by design ('AXIOM_CORPUS_INGEST_PUBLIC_KEY is required in CI') and fail this job; guard-ingested also fails if the change touches protected corpus artifacts, manifest-attested reasoning logs, or the ingest manifests attesting them. Fix: a maintainer restores the variable in this repository's Actions settings (it is a public verification key, not a secret); nothing in the branch needs to change. Do not weaken those tests or embed key material."
          fi
          echo "::error title=${title}::${body}"
          {
            echo "### ${title}"
            echo
            echo "${body}"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install corpus artifact guard
        if: github.event_name != 'schedule'
        run: |
          cd "$RUNNER_TEMP"
          python -I -m pip install --upgrade pip
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
            VERIFIER_DIR="$RUNNER_TEMP/axiom-corpus-verifier"
            git clone --no-checkout "$GITHUB_SERVER_URL/${{ github.repository }}.git" "$VERIFIER_DIR"
            git -C "$VERIFIER_DIR" fetch --depth 1 origin "$BASE_REF"
            git -C "$VERIFIER_DIR" checkout --detach "$BASE_REF"
            if [ -f "$VERIFIER_DIR/src/axiom_corpus/corpus/ingest_manifests.py" ]; then
              python -I -m pip install "$VERIFIER_DIR"
            else
              echo "Base commit has no ingest guard yet; using checked-out bootstrap guard."
              python -I -m pip install -e "$GITHUB_WORKSPACE"
            fi
          else
            python -I -m pip install -e "$GITHUB_WORKSPACE"
          fi

      - name: Guard generated corpus artifacts
        if: github.event_name != 'schedule'
        env:
          AXIOM_CORPUS_INGEST_PUBLIC_KEY: ${{ vars.AXIOM_CORPUS_INGEST_PUBLIC_KEY }}
          # Read-only R2 token for corpus bytes kept outside git
          # (docs/corpus-storage.md). Unused until .axiom/corpus-locks exists.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_CORPUS_READ_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_CORPUS_READ_SECRET_ACCESS_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          else
            BASE_REF="${{ github.event.before }}"
          fi
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="HEAD~1"
          fi
          axiom-corpus-ingest guard-ingested \
            --base-ref "$BASE_REF" \
            --head-ref "${{ github.sha }}"

      - name: Audit every corpus lock entry's attestation
        # The guard checks lock changes against the base; this checks every
        # entry against signed manifests and the base branch's first-parent
        # history. Like the guard, it runs the verifier installed from the
        # base commit, so a pull request cannot change the verifier's code
        # (this workflow file itself still comes from the pull request, so
        # review of workflow changes stays the trust root). No-op without
        # lock files.
        env:
          AXIOM_CORPUS_INGEST_PUBLIC_KEY: ${{ vars.AXIOM_CORPUS_INGEST_PUBLIC_KEY }}
        run: |
          if [ ! -d .axiom/corpus-locks ]; then
            echo "No corpus lock files; corpus bytes are tracked in git."
            exit 0
          fi
          if ! axiom-corpus-ingest corpus verify --help 2>/dev/null | grep -q -- '--attest'; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              # Only the pull request that adds lock audits has a base without them.
              echo "The base commit's verifier predates lock audits; auditing with the checked-out code."
            else
              # push and schedule runs audit the branch's own commit with its own code.
              echo "No base verifier on ${{ github.event_name }} runs; auditing with the checked-out code."
            fi
            python -I -m pip install -e "$GITHUB_WORKSPACE"
          fi
          axiom-corpus-ingest corpus verify --attest --ref "${{ github.sha }}"

      - name: Install dependencies
        run: |
          cd "$RUNNER_TEMP"
          python -I -m pip install --upgrade pip
          python -I -m pip install -e "${GITHUB_WORKSPACE}[dev]"

      - name: Check R2 serves every new corpus lock entry
        # Every object a lock entry names must be fetchable before it merges;
        # pushes and the daily run check every entry. No-op without lock files.
        env:
          # Read-only R2 token for corpus bytes kept outside git
          # (docs/corpus-storage.md). Unused until .axiom/corpus-locks exists.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_CORPUS_READ_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_CORPUS_READ_SECRET_ACCESS_KEY }}
        run: |
          if [ ! -d .axiom/corpus-locks ]; then
            echo "No corpus lock files; corpus bytes are tracked in git."
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            axiom-corpus-ingest corpus verify --remote \
              --changed-since "${{ github.event.pull_request.base.sha }}"
          else
            axiom-corpus-ingest corpus verify --remote
          fi

      - name: Fetch the corpus the tests read
        # Tests read real corpus data (often whole release selectors), and
        # tests/conftest.py stops the session if any locked file is absent.
        # --no-cache streams verified bytes into place: runners have no
        # copy-on-write clones, so a cache would double disk use. The full
        # history checkout above serves migrated files from git objects.
        # No-op without lock files.
        env:
          # Read-only R2 token for corpus bytes kept outside git
          # (docs/corpus-storage.md). Unused until .axiom/corpus-locks exists.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_CORPUS_READ_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_CORPUS_READ_SECRET_ACCESS_KEY }}
        run: axiom-corpus-ingest corpus fetch --all --no-cache --workers 32

      - name: Check changelog fragments
        run: python -m towncrier build --draft --version 0.0.0

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Type check with mypy
        run: |
          mypy src/axiom_corpus/corpus --ignore-missing-imports

      - name: Run tests with coverage
        run: |
          python -I -m pip install pytest-cov pytest-timeout
          pytest -v --cov=axiom_corpus --cov-report=term-missing --cov-config=pyproject.toml --timeout=60

  citation-path-grammar:
    name: Citation-path grammar (A6)
    # Additive gate: validates every corpus citation_path against the versioned
    # grammar (schema/citation-path.v1.json) and enforces the irregular-family
    # and identity-drift ratchets. Pure local scan — no Supabase, no secrets —
    # so it runs on PRs too, unlike verify-release-coverage.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Python 3.14
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14"

      - name: Fetch every locked provisions file
        # The scan reads every provisions JSONL; with corpus bytes outside git
        # they come from R2. No-op without lock files.
        env:
          # Read-only R2 token for corpus bytes kept outside git
          # (docs/corpus-storage.md). Unused until .axiom/corpus-locks exists.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_CORPUS_READ_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_CORPUS_READ_SECRET_ACCESS_KEY }}
        run: |
          if [ -d .axiom/corpus-locks ]; then
            python -I -m pip install -e .
            axiom-corpus-ingest corpus fetch --path data/corpus/provisions --no-cache --workers 32
          else
            echo "No corpus lock files; corpus bytes are tracked in git."
          fi

      - name: Validate citation paths against the grammar
        run: |
          python scripts/validate_citation_paths.py

  postgres:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: axiom_corpus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Python 3.14
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      - name: Test PostgreSQL connection
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/axiom_corpus_test
        run: |
          python -c "
          from axiom_corpus.storage import PostgresStorage
          storage = PostgresStorage()
          print('PostgreSQL connection successful')
          print('Stats:', storage.get_stats())
          "

      - name: Test atomic named-release migration in PostgreSQL
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/axiom_corpus_test
          # Database-only tests: they read no corpus files, so this job skips the
          # corpus fetch (tests/conftest.py).
          AXIOM_CORPUS_PARTIAL_TESTS: "1"
        run: |
          pytest -v tests/test_atomic_release_postgres.py

      - name: Test work queue claims in PostgreSQL
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/axiom_corpus_test
          AXIOM_CORPUS_PARTIAL_TESTS: "1"
        run: |
          pytest -v tests/test_ops_work_queue_postgres.py

  verify-release-coverage:
    name: Verify release coverage
    # Skip on PRs:
    # - Pull-request CI runs in fork context cannot read repo/org secrets.
    # - Pre-merge is the wrong gate anyway: the check reads PRODUCTION
    #   Supabase state; a PR that adds a new jurisdiction hasn't yet
    #   landed any rows in production at PR-CI time, so the check would
    #   pass even though the manifest is missing an entry.
    # - The intent is "catch drift fast" — runs on push-to-main and on a
    #   daily cron.
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      # Reuse the anon (read-only, RLS-gated) Supabase key already
      # provisioned as an org secret for the foundation.org deploy.
      SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Python 3.14
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify release coverage
        if: env.SUPABASE_ANON_KEY != ''
        run: |
          axiom-corpus-ingest verify-release-coverage \
            --service-key-env SUPABASE_ANON_KEY

      - name: Skip release coverage without Supabase secret
        if: env.SUPABASE_ANON_KEY == ''
        run: |
          echo "Skipping release coverage: NEXT_PUBLIC_SUPABASE_ANON_KEY is not available in this GitHub Actions context."

  validate-release:
    name: Validate named release selectors
    # Local deep validation is mandatory for every tracked immutable selector.
    # The production publisher independently repeats it after exact R2 readback
    # and staged database counts, immediately before signing.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14"
      - name: Install package
        run: python -I -m pip install -e .
      - name: Fetch the corpus the selectors name
        # Deep validation reads every selected scope's artifacts; with corpus
        # bytes outside git they come from R2. No-op without lock files.
        env:
          # Read-only R2 token for corpus bytes kept outside git
          # (docs/corpus-storage.md). Unused until .axiom/corpus-locks exists.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_CORPUS_READ_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_CORPUS_READ_SECRET_ACCESS_KEY }}
        run: |
          if [ -d .axiom/corpus-locks ]; then
            set --
            for selector in manifests/releases/*.json; do set -- "$@" --release "$selector"; done
            axiom-corpus-ingest corpus fetch --no-cache --workers 32 "$@"
          else
            echo "No corpus lock files; corpus bytes are tracked in git."
          fi
      - name: Deep-validate every named release selector
        # The step above fetched every selected scope; validation itself
        # never reaches the network.
        env:
          AXIOM_CORPUS_NO_FETCH: "1"
        run: |
          found=0
          for selector in manifests/releases/*.json; do
            [ -f "$selector" ] || continue
            found=1
            axiom-corpus-ingest validate-release \
              --base data/corpus \
              --release "$selector" \
              --max-issues 100
          done
          [ "$found" = "1" ]
