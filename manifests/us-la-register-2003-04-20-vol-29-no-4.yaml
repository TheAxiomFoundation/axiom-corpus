      relevant_rule:
        title: Food Stamp Program—2002 Farm Bill (LAC 67:III.1917, 1932, 1949, 1953, 1961, 1965, 1966, 1980, 1983 and 2013)
        issuing_agency: Louisiana Department of Social Services, Office of Family Support
        register_citation: LR 29:605 (April 2003)
        document_number: 0304#065
        printed_pages: 605-607
        pdf_pages: 94-96
        program: SNAP
        topic: legally_obligated_child_support_payment_exclusion
        child_support_clause: >-
          LAC 67:III.1980.C, printed on page 607 (PDF page 96): "Legally obligated
          child support payments to non-household members are excluded when
          determining eligibility based on gross income standards." The August 2026
          LAC prints this clause as 1980.A.3.
        authority_role: >-
          The rule amends LAC 67:III.1980 to exclude legally obligated child support
          paid to nonhousehold members when determining eligibility under the gross
          income standards.
