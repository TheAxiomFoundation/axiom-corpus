    approval_date: '2020-05-07'
    effective_date: '2020-03-01'
    summary: This time-limited state plan amendment responds to the COVID-19 national emergency. The purpose of this amendment
      is to waive residency requirement for individuals in state temporarily, extend reasonable opportunity period for non-citizens
      declaring satisfactory immigration status, suspend all cost-sharing for testing services, suspend premiums for certain
      populations, add temporary provisions allowing Community 1st Choice in Acute Hospital setting, allow students with completed
      coursework to practice as unlicensed mental health professionals, amend provider qualifications to remove First Aid
      & CPR requirements, expand Pharmacist scope of practice definition, increases allowable day-supply limits for prescription
      drugs, waive requirement for the return of unused unit dose medications dispensed in LTC based on infection control,
      increase reimbursement of professional dispensing fees due to incurred cost of delivery, allow the pricing methodology
      for covered outpatient drugs dispensed by a retail-based pharmacy to be bypassed when a medication’s acquisition cost
      exceeds the standard “lesser of” payment methodology logic through petitioning at the point of sale, provide exceptions
      to state's Preferred Drug List if a shortage occurs, and modify reimbursement to reflect a per-episode rate equal to
      current monthly rate for Infant Learning Program (ILP) & Long Term Services & Support (LTSS).
    topics:
    - Benefits
    - Cost Sharing
    - Disaster Relief
    - Eligibility
    - Financing & Reimbursement
    - Premiums
    - Prescription Drugs
    link_label: Approval Document
