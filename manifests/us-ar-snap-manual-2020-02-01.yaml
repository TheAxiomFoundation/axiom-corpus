      topic: legally_obligated_child_support_deduction
      authority_role: >-
        6550 (PDF page 642) allows a deduction for legally obligated child support
        paid to a nonhousehold member. 7524 (PDF pages 687-688) allows no deduction
        in the gross income calculation except the farm loss deduction. 6100 (PDF
        page 615) says deductions are applied after gross income is calculated, and
        7600 (PDF page 690) lists the child support deduction before the excess
        shelter computation. The 7610 worksheet (PDF page 692) enters child support
        on line 11, although its printed line 12 totals only lines 7-10.
