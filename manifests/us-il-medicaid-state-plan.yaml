    effective_date: '2020-03-01'
    summary: This time-limited state plan amendment responds to the COVID-19 national emergency. The purpose of this amendment
      is to cover the new optional group for COVID testing, suspend the resource test in determining eligibility for certain
      eligibility groups, add presumptive eligibility (PE) for certain eligibility groups, suspend premiums for certain individuals,
      expand telehealth, extend all prior authorization for medications by automatic renewal without clinical review or time/quantity
      extensions, allow the state to make exceptions to its published Preferred Drug List if drug shortages occur, and increase
      certain payment rates.
