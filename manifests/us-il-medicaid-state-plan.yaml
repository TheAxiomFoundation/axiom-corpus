    approval_date: '2024-03-27'
    effective_date: '2023-05-12'
    summary: CMS is approving this time-limited state plan amendment to allow the state to implement temporary policies while
      returning to normal operations after the COVID-19 national emergency. The purpose of this amendment is to extend certain
      COVID-19 disaster relief policies originally approved in Disaster Relief SPAs IL-20-0004, IL-20-0013, IL-21-0004, IL-21-0005,
      and IL-23-0016. This amendment also proposes to add a new Section 7.4.C to temporarily increase the asset test to $17,500
      for Medicaid beneficiaries determined eligible through the Aged, Blind, and Disabled category.
    topics:
    - Disaster Relief
    - Eligibility
    - Reimbursement
    link_label: Approval Document
