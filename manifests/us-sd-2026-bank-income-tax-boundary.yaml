      source_note: >-
        Current official codified-law chapter titled Income Tax on Banks and
        Financial Corporations. This intake supplies the higher-authority
        boundary showing that chapter 10-43 imposes its income tax on financial
        institutions. It does not itself establish a natural person's annual
        resident liability; the Department of Revenue's official January 2026
        guide supplies the affirmative no-personal-income-tax statement.
