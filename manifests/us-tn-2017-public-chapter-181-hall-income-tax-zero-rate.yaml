      certification_scope: hall_income_tax_zero_rate
      source_note: >-
        Enacted Public Chapter 181 amends Tennessee Code Annotated section
        67-2-102 to set the chapter 2 tax rate to zero percent for every tax
        year beginning on or after January 1, 2021. Sections 14 and 15 preserve
        the related cross-reference and move the chapter's sunset date to
        January 1, 2021. The retained two-page window continues through the
        unrelated fuel-tax provisions that share page 4; those provisions are
        preserved for page fidelity but are outside this certification scope.
