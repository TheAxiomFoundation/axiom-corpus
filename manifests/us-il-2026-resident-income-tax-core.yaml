    source_url: https://www.ilga.gov/Documents/Legislation/PublicActs/104/PDF/104-0468.pdf
    source_format: pdf
    source_as_of: "2026-07-24"
    expression_date: "2026-06-16"
    citation_path: us-il/statute/public-act/104-0468
    extraction:
      segmentation: single_block
    metadata:
      primary_source: true
      source_authority: Illinois General Assembly
      legal_identifier: Public Act 104-0468
      document_subtype: state_session_law
      program: individual_income_tax
      source_status: enacted_2026_session_law
      source_note: >-
        Enacted 2026 income-tax amendments, including the section 203
        qualified-small-business-stock addition for tax years ending on or
        after December 31, 2026 and the section 201 pass-through-entity tax
        election changes. Article 999 makes Article 120 effective when the Act
        became law on June 16, 2026; the July 1 effective date applies only to
        Articles 25 and 65.
