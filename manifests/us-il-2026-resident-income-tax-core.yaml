      document_subtype: state_statute
      program: individual_income_tax
      source_status: current_ilcs_with_2026_session_overlay_required
      source_note: >-
        Current official ILCS section imposing individual income tax, setting
        the 4.95 percent rate, defining the education-expense credit, and
        identifying specialty surcharge, recapture, and pass-through-entity
        branches. Public Act 104-0468 is separately pinned because the ILCS
        database warns that recent laws may not yet be incorporated.

