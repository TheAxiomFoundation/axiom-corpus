      child_support_deduction_section_latest_amendment: '2008-11-22'
      child_support_deduction_section_latest_amendment_note: >-
        Printed history of section 17-676-72 on PDF page 48, am 11/22/08; this does
        not assert the initial adoption date of paragraph (6).
      extraction_granularity: pdf_page
      topic: legally_obligated_child_support_deduction
      authority_role: >-
        Child support paid is a net-income deduction with no gross-income exclusion.
        17-676-72(6) (PDF page 48) allows a deduction for legally obligated payments to
        or for a nonhousehold member, including arrearages; alimony is not included in
        it. 17-676-56(f) (PDF page 38) subtracts the payments in the net income
        computation, though the section's printed cross-references in (g) and (j)(1)
        name only subsections (c) to (e); 17-676-72(5) and 17-676-74(a) put child
        support among the deductions taken before the shelter computation.
