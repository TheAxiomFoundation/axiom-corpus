    extraction:
      segmentation: labeled_sections
      section_heading_pattern: '^(?P<heading>Formuesverdi boligeiendom|Formuesverdien skal ikke overstige:)$'
      section_label_template: '{heading}'
      section_label_replacements:
        Formuesverdi boligeiendom: formuesverdi-boligeiendom
        'Formuesverdien skal ikke overstige:': maksimal-formuesverdi
      stop_text_pattern: '^Om Skatteetaten$'
    metadata:
      primary_source: true
      source_authority: Norwegian Tax Administration
      source_family: wealth-tax/asset-valuation
      source_note: >-
        Historical 2022 rate page: primary dwelling at 25 percent through NOK
        10 million and 50 percent above; secondary dwelling at 95 percent.
