    amendment_summary: The NA Expanded Categorical Eligibility gross income limit
      changed from 185% of the Federal Poverty Level to 200% for the benefit month
      of 03/2026 and ongoing (FAA5.I01B NA Categorical Eligibility and FAA5.I01A
      NA Eligibility and Benefit Determination, updated as of 03/23/2026, effective
      03/01/2026). The 185%-to-130% change announced on 02/23/2026 was recalled.
