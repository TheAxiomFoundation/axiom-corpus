version: "2026-09-14-income-tax-chapter"
# Whole state income-tax chapter statute scopes for the partial-chapter states of the
# needs-driven closure check (docs/coverage/needs-closure-2026-09-11/tax.md, top gap 3).
# One source per jurisdiction; every source runs the state's existing source-first
# adapter against the legislature's own publisher, restricted to the income-tax
# chapter where the adapter has a chapter filter and to the enclosing taxation title
# otherwise. The adapters append their own scope suffix to the version
# (for example -us-mi-chapter-206), so the on-disk scope version is this prefix plus
# the suffix recorded in docs/ingest-runs/2026-09-14-state-tax-statute-ty2026.md.
# Kentucky, Virginia, New York and California run through separate manifests
# (official-documents extractor or the California section extractor), see the run note.
