      title_short: LOV nr 482 af 22/05/2024
      document_type: ændringslov (amendment act)
      amends: >-
        Personskatteloven (act § 1), ligningsloven (act § 2), lov om en
        børne- og ungeydelse (act § 4), and pensionsbeskatningsloven (act
        § 7), plus five acts outside this Tier-1 scope. Act § 4 changes
        "topskat" to "mellemskat" in børne- og ungeydelsesloven § 1 a,
        stk. 1, 1. pkt., and stk. 2.
