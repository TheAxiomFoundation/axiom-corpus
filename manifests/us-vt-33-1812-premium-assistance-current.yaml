      source_note: >-
        Current official codified source unit for 33 V.S.A. § 1812, the
        Vermont Health Benefit Exchange financial-assistance program (added
        2013, No. 50, § E.307.1, eff. Oct. 1, 2013; amended 2015, No. 23, § 54;
        2017, No. 88 (Adj. Sess.), § 4, eff. Feb. 20, 2018). The content
        selector captures the single-section statute body from the Vermont
        General Assembly statutes site. Subsection (a) establishes premium
        assistance for individuals and families eligible for federal premium
        tax credits under 26 U.S.C. § 36B with income at or below 300 per cent
        of the federal poverty level, and directs the Department of Vermont
        Health Access to reduce the premium contribution by 1.5 per cent below
        the amount established in § 36B on a sliding MAGI scale for the same
        qualified health benefit plans. Subsection (b) establishes cost-sharing
        assistance on a sliding actuarial-value schedule (94/87/77/73 per cent
        by FPL band). It supports the rulespec-us reference encoding at
        us-vt/statutes/33/1812 and the premium-subsidy oracle comparison
        against PolicyEngine-US vt_premium_assistance (policyengine-us#9245).
