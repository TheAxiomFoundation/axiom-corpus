  # commencement and application sections stand on their own.  §6 is the
  # commencement of amendment 288 to the Ordinance (פרק ג׳, ריווח מדרגות מס
  # הכנסה) — 1 January 2026 for income produced or accrued from that day — and is
  # the corpus provision a §121 encoding can cite for its version date.
  - source_id: economic-efficiency-law-2026
