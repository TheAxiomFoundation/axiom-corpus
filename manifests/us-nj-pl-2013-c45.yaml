    authority_role: >-
      Section 10, codified as N.J.S.A. 44:10-104, requires the department and county
      welfare agencies to exclude legally obligated or court-ordered child support
      paid to or for a non-household member from household income for both the gross
      and net SNAP income eligibility standards.
