    register_citation_note: >-
      From the history notes of the rules this proposal amends, in the released scope
      us-nj/regulation/2026-07-17-nj-snap-rules (e.g.
      us-nj/regulation/njac-10-87/10-87-5.9): "Amended by R.2017 d.022, effective
      February 6, 2017. See: 48 N.J.R. 695(a), 49 N.J.R. 267(a)." The agency copy
      itself prints no N.J.R. page.
    printed_header_citation: 48 NJR 5(1)
    printed_header_citation_note: Printed unlabeled at the top of page 1; it is not an N.J.R. volume-page citation.
    adopted_as: R.2017 d.022, effective February 6, 2017 (49 N.J.R. 267(a))
    publication_date: '2016-05-02'
    filing_date: '2016-04-07'
    expression_date_note: >-
      The unlabeled date "May 2, 2016" printed under the page-1 header is read as the
      N.J.R. publication date; it matches the 60-day comment period ending July 1,
      2016 ("Submit comments by July 1, 2016"). The filing date is printed "Filed
      April 7, 2016". This is a proposal, not an adopted regulation.
    source_as_of_note: official publisher retrieval date
    amendment_convention: >-
      Page 8 specifies additions in boldface and deletions in brackets. On pages 9-20
      bold additions are written {+text+} and bracketed deletions [-text-], the
      brackets replaced by the delimiters. The deletion of N.J.A.C. 10:87-5.10(a)4v and
      (a)5 runs from page 11 to page 12, and another from page 18 to page 19; those
      rows carry deletion_continues_to_next_page / deletion_continues_from_previous_page.
      Pages 1-8 and the running page numbers are not marked.
    authority_role: >-
      Proposes N.J.A.C. 10:87-5.9(a)20, excluding legally obligated or court-ordered
      child support paid to or for a non-household member from income, and deletes
      the child support deduction at 10:87-5.10(a)4v and (a)5, to implement P.L. 2013,
      c.45; the proposal date alone does not date the statutory election.
