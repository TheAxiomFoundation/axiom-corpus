    document_subtype: spa_approval_package
    transmittal_number: MD-23-0002-CHIP &amp; MD-23-0003-CHIP &amp; MD-23-0004-CHIP
    cms_node_id: '152926'
    cms_record_url: https://www.medicaid.gov/chip/state-program-information/chip-spa?filter%5Bnid%5D%5Beq%5D=152926
    approval_date: '2023-09-08'
    effective_date: '2023-07-01'
    summary: Collectively, these SPAs create a separate CHIP for the from-to-conception-to-end-of-pregnancy population (FCEP,
      otherwise known as the "unborn" option) Collectively, with household incomes up to 259 percent of the federal poverty
      level (FPL), for birth parents that are not otherwise eligible for Medicaid or CHIP. Specifically, MD-23-0003-CHIP and
      MD-23-0004 establishes financial eligibility and residency requirements respectively for the new separate CHIP FCEP
      population. In addition, MD-23-0002-CHIP creates a new Health Services Initiative (HSI) program to cover postpartum
      services to birth parents from the same population through the end of the month in which the 120th postpartum day occurs.
    topics:
    - Benefits
    - Health Services Initiatives
    link_label: Approval Package
