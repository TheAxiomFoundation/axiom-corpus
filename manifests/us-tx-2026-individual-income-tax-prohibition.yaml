      source_note: >-
        Current official Texas Constitution text. Article VIII, section 24-a
        prohibits the legislature from imposing a tax on the net incomes of
        individuals, including an individual's share of partnership and
        unincorporated-association income. Section 24-b, added November 4,
        2025, separately prohibits taxes on realized or unrealized capital
        gains of an individual, family, estate, or trust, while preserving ad
        valorem, sales, and use taxes. This intake proves the absence of a
        tax-year-2026 resident individual net-income tax through the
        pre-credit tax stage. It does not certify a complete nonrefundable-
        credit, refundable-credit, or signed net-liability surface, and it
        excludes business and entity taxes, payments, filing administration,
        local taxes, and nonresident allocation.
