      authority_role: >-
        B-4223.6 (PDF page 127), headed "DEDUCTION FOR LEGALLY OBLIGATED CHILD SUPPORT
        PAID TO NONHOUSEHOLD MEMBERS", subtracts the payments "from the household's
        total countable gross income" and "prior to any gross income test to
        determine eligibility": an exclusion before the gross test in mechanics,
        although the rule calls it a deduction.
