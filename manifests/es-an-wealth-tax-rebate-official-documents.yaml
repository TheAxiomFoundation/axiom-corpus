      stop_text_pattern: '^Artículo\s+segundo\.'
    metadata:
      primary_source: true
      source_authority: Junta de Andalucía, Boletín Oficial de la Junta de Andalucía
      source_family: wealth-tax/regional-rebate
      source_note: >-
        Extraction retains Article 1 and stops before Article 2. Article 1.Tres
        inserts article 25 bis in Ley 5/2021, granting a 100
        percent wealth-tax quota rebate. Do not describe this clause itself as
        expressly retroactive to 1 January: the decree was operative before
        the tax's 31 December 2022 accrual, while the final provision's explicit
        1 January effects language identifies its IRPF clauses.
