        - '^\s*National Social Security Fund Act\s+[\[(]Cap\.\s*230\.\s+\d{4}\s*$'
      text_replacements:
        # OCR misreads (section 1 of the header note)
        'during that month to that employce.': 'during that month to that employee.'
        'appreciable effect on the contribution duc.': 'appreciable effect on the contribution due.'
        'Ifancligible employce is employed': 'If an eligible employee is employed'
        'part of the employcc’s share of a standard contribution.': 'part of the employee’s share of a standard contribution.'
        'engagement,': 'engagement;'
        'class of employces or any employer': 'class of employees or any employer'
        'in whole or in part the employce’s': 'in whole or in part the employee’s'
        "docs not pay it to the Fund as part of the employee's share": 'does not pay it to the Fund as part of the employee’s share'
        "contribution, the employee's account shall be credited": 'contribution, the employee’s account shall be credited'
        'Forthe purpose of any enactment': 'For the purpose of any enactment'
        'Onand after the appointed day': 'On and after the appointed day'
        '(a) anon-resident employee': '(a) a non-resident employee'
        'calculated from fifly cents': 'calculated from fifty cents'
        'such retums showing the number': 'such returns showing the number'
        # Margin restorations (section 2 of the header note)
        'furnish to the Managing Director on ar': 'furnish to the Managing Director on an'
        'regarding each eligible employee in his or he': 'regarding each eligible employee in his or her'
        'the contribution due on such wages, the total wage': 'the contribution due on such wages, the total wages'
        'and the total contributions and such other information a': 'and the total contributions and such other information as'
        'may deduct from the monthly wa': 'may deduct from the monthly wage'
        'the employee’s share ofa standard contributi': 'the employee’s share of a standard contribution'
        'total wages paid during that month to t': 'total wages paid during that month to that'
        'more than one wage payment is made during any mor': 'more than one wage payment is made during any month,'
        'a member of the Fund or not, tha': 'a member of the Fund or not, that'
        'the age of fifty-five years in respec': 'the age of fifty-five years in respect'
        'has specifically applied this section t': 'has specifically applied this section by'
      section_label_replacements:
        'Payment of standard contribution by employers': section-10-payment-of-standard-contribution-by-employers
        "Employee’s share of standard contribution": section-11-employees-share-of-standard-contribution
        "Employee's share of standard contribution": section-11-employees-share-of-standard-contribution
        'Special contribution by contributing employers': section-12-special-contribution
    metadata:
      primary_source: true
      source_authority: Republic of Uganda (Laws of Uganda revised-edition volume)
      publisher: Uganda Printing and Publishing Corporation (UPPC), Entebbe
      commencement_date: '1985-12-01'
      source_family: social-security/nssf-contributions
      source_note: >-
        National Social Security Fund Act (Chapter 230) sections 10-12
        from the Fund's hosted scan of the Laws of Uganda revised-edition
        volume pages (running heads "[Cap. 230", volume pagination 8208
        onward; OCR at 300 dpi). Section 10: standard contribution of
        fifteen percent of monthly total wages paid by the contributing
        employer; section 11: the employer may deduct the employee's
        share of five percent; section 12: special contribution of ten
        percent for excepted employees. The rates are original Act 8 of
        1985 text, unchanged by the NSSF (Amendment) Act 2021 (print
        held for diligence; it modernises definitions, membership and
        voluntary contributions only).
      transcription_note: >-
        OCR misreads are corrected to the printed text, checked on the
        page images. The scan is cut at the right margin of volume pages
        8215 and 8217, so eleven line-final words are completed:
        s.10(6) "an", "her", "wages", "as"; s.11(1) "wage",
        "contribution", "that", "month,"; s.12(1) "that", "respect",
        "by". Each completion is the only word that fits the visible
        letters and matches the Laws of Uganda 2000 revised edition
        (Cap. 222). The plural "wages", "that" and the comma after
        "month" rest on the 2000 edition alone. Running heads are
        dropped, and section 12 ends before section 13.
