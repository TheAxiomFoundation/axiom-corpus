# Uganda NSSF contribution capture (rulespec-ug instrument 5-6, UGAMOD
# tscee_ug/tscer_ug parity; tracking rulespec-ug#1).
#
# The National Social Security Fund Act (Chapter 230 on the face of the
# revised-edition volume print; Act 8 of 1985, commencement 1 December
# 1985): section 10 requires a contributing employer to pay a STANDARD
# CONTRIBUTION of fifteen percent of the monthly total wages of each
# eligible employee; section 11 lets the employer deduct the EMPLOYEE'S
# SHARE of five percent from the employee's wages (the employer bears
# the remaining ten percent economically - UGAMOD's tscee_s 5% /
# tscer_s 10% split, probed exact); section 12 sets the special
# contribution (ten percent) for employees excepted from the standard
# scheme. The NSSF (Amendment) Act 2021 (print held locally) modernises
# definitions, membership and voluntary provisions and does NOT restate
# the section 10-12 rates.
#
# Source: the Fund's own hosted scan of the revised-edition volume pages
# (running heads "[Cap. 230" with Laws-of-Uganda volume pagination
# 8208-); faithful reproduction of the official revised-edition print,
# accepted per the Ghana Sage-hosted Assembly Press precedent with the
# authenticity features on the face cross-checked (chapter number,
# commencement, volume page numbers).
#
# Transcription corrections (version 2026-09-25-ug-nssf-contributions,
# replacing 2026-07-08-ug-nssf-contributions). Tesseract at 300 dpi
# reproduces the July capture byte for byte; the text_replacements below
# are keyed to that exact output and are applied to each page's OCR text
# before segmentation.
#
# 1. OCR misreads, corrected to what the print shows. The scan's "e" is
#    worn to a "c" shape throughout, and some word spaces are closed up.
#    Each correction was checked on the page image at 300 dpi and against
#    independent Tesseract passes at 450 dpi (psm 6) and 600 dpi (psm 3):
#      p. 8215  employce -> employee (s.10(1)); duc -> due (s.10(2));
#               Ifancligible employce -> If an eligible employee (s.10(3));
#               ofa -> of a (s.11(1))
#      p. 8216  employcc's -> employee's (s.11(1));
#               engagement, -> engagement; (s.11(4)(b); both other passes
#               read the semicolon)
#      p. 8217  employces -> employees (s.11(4)(d)); employce's ->
#               employee's, docs -> does, and two straight apostrophes ->
#               the print's curly apostrophe (s.11(5)); Forthe -> For the
#               (s.11(7)); Onand -> On and (s.12(1)); anon-resident ->
#               a non-resident (s.12(1)(a))
#      p. 8218  fifly -> fifty (s.12(1)); retums -> returns (s.12(2))
# 2. Margin restorations. On pp. 8215 and 8217 the scan itself is cut at
#    the right margin: the high-resolution text layer of the PDF ends at
#    the same edge, so the letters are absent from this print, not
#    misread. Eleven line-final words are completed. Each completion is
#    the only word that fits the visible letters and the grammar, and each
#    matches the wording of the Laws of Uganda 2000 revised edition
#    (Cap. 222) at the same point:
#      p. 8215  "on ar" -> "on an", "his or he" -> "his or her",
#               "the total wage" -> "the total wages", "information a" ->
#               "information as" (s.10(6)); "monthly wa" -> "monthly
#               wage", "contributi" -> "contribution", "to t" -> "to that",
#               "any mor" -> "any month," (s.11(1))
#      p. 8217  "tha" -> "that", "in respec" -> "in respect", "this
#               section t" -> "this section by" (s.12(1))
#    Three completions go beyond the visible letters: the plural in
#    "wages", "that" (not "the") and the comma after "month". All three
#    follow the 2000 edition; an uncropped print of the 2023 revised
#    edition would settle them.
# 3. Running heads ("8215", "[Cap. 230." and the Act title) are dropped as
#    page furniture, so they no longer interrupt s.10(1), s.11(1) and
#    s.12(1).
# 4. Section 12 now ends before "13. Voluntary contributions"; the July
#    row ran on through all of section 13.
documents:
  - source_id: ug-cap-230-nssf-act-contributions
    jurisdiction: ug
    document_class: statute
    citation_path: ug/statute/cap-230/national-social-security-fund-act
    title: National Social Security Fund Act (Cap. 230) — standard, employee-share and special contributions (ss. 10-12)
    source_url: https://www.nssfug.org/site/assets/files/1501/nssf_act_cap_230.pdf
    source_format: pdf
    source_as_of: '2026-09-25'
    expression_date: '1985-12-01'
    request:
      browser_user_agent: true
    extraction:
