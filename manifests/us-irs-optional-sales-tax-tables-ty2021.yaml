    table_no_state_sales_tax: AK DE MT NH OR (no column; Alaska appears only in a note)
    table_footnotes_used: 1 2 3 4 5 6
    table_footnote_legend_abridged: 1. Use the Ratio Method to determine your local sales tax
      deduction. 2. Follow the instructions on the next page to determine your local sales tax
      deduction. 3. The California table includes the 1.25% uniform local sales tax rate. 4.
      This state does not have a local general sales tax. 5. The Nevada table includes the 2.25%
      uniform local sales tax rate. 6. The 4.0% rate for Hawaii is actually an excise tax.
