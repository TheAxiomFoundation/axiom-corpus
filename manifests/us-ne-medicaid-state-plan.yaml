    summary: Revising the State's Tribal consultation process. This SPA added language changing the current process of Tribal
      consulting on all proposed SPAs and waivers regardless of impact, to not providing Tribal consultation on SPAs that
      are purely technical in nature (i.e. pagination changes, renumbering of lists, etc.) and therefore; have no direct impact
      on the Tribes. This SPA also provided evidence of your continued process of informing and seeking input from all federally
      recognized Native American Tribes and Indian Health Programs within the State of Nebraska regarding all other SPAs and
      waivers, the overall Tribal consultation process and required timeframes, as well as, discussing any possible impact
      proposed SPAs might have on the Tribes.
