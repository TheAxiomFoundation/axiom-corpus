      for children from conception to birth. SPA SD-16-0007 specifies that this population will be excluded from the state's
      90-day waiting period. A copy of the approved CS9 is attached and incorporated into section 4.1.9 of the state's current
      CHIP state plan. A copy of the approved CS20 state plan page is attached and supersedes section 4.4.4.1 of the current
      CHIP state plan.
