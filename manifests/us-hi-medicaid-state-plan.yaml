    effective_date: '2014-01-01'
    summary: 'The proposed amendments to the State Plan would implement provisions of the Patient Protection and Affordable
      Care Act of 2010 and the Health Care and Education Reconciliation Act of 2010. The proposed amendments implements the
      following: 1) New Medicaid eligibility groups; 2) Establishes financial methodologies for determining Medicaid eligibility
      based on modified adjust gross income (MAGI); 3) Establish simplified and date-driven renewal polices for individuals
      who eligibility is based on MAGI; 4) Simplifies residency, citizenship and immigration status; and 5) Allows presumptive
      eligibility conducted by hospitals for certain Medicaid eligibility groups.'
