# Arizona DES Cash and Nutrition Assistance Policy Manual pages that the Arizona SNAP
# screener cites and the corpus does not hold (FAA3, FAA4, FAA6).
#
# dbmefaapolicy.azdes.gov answers unattended clients with a Cloudflare challenge.
# Each page was saved by a person in an ordinary browser ("Save Page As, Webpage,
# HTML Only"), the same capture method as us-az/manual/2026-07-17-faa5-recovery
# (axiom-corpus #383). No automated fetch and no browser impersonation was used.
# local_path is relative to this file and names the retained copy where the corpus
# locks it (sources/<scope>/official-documents/), so `corpus fetch` supplies it on any
# machine. Rows record the official source_url, never the path. A provenance sidecar
# per file (url, sha256, fetched_at, fetch_method) sits beside it in provenance/.
# YYYY-MM-DD is the capture date; it is filled in once, before extraction and signing.
#
# source_as_of is the capture date, set on the command line (--source-as-of).
# expression_date is kept only where the page carries its own "last revised" or
# change-index date; otherwise it defaults to the capture date.
#
# Version is set on the command line; this key is documentation only:
version: YYYY-MM-DD-az-des-snap-screener-pages
