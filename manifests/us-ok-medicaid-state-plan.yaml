      testing, and treatment for eligible members; allow independently contracted psychologists to serve SoonerCare adults
      only for crisis intervention services during the emergency period; change the 34-day supply prescription quantity limit
      to allow for a 90-day supply; expand Prior Authorizations for medications; waive calendar year 2019 penalties for Potentially
      Preventable Readmissions program; increase the number of therapeutic leave days in nursing facilities (NFs) and Intermediate
      Care Facilities for Individuals with Intellectual Disabilities (ICF/IIDs); and waive the provision that payments for
      therapeutic leave days could not exceed a maximum of 14 consecutive days per absence for ICF/IIDs.
