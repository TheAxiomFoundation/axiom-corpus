    metadata:
      primary_source: true
      source_authority: Vermont Department for Children and Families, Economic Services Division
      official_publisher: Vermont Department for Children and Families
      document_subtype: final_proposed_rule_repeal_bulletin
      document_number: Bulletin No. 18-06F
      program: SNAP
      topic: snap_state_rule_repeal_program_options_continuity
      bulletin_date: '2018-12-10'
      effective_date: '2019-01-01'
      effective_date_note: >-
        The cover prints "CHANGES ADOPTED EFFECTIVE January 1, 2019" and marks the
        instruction "Proposed Regulation". Page 2 says copies of the final proposed
        rule were filed November 7, 2018, LCAR approved it November 29, 2018, the
        department expected to file the final rule on or before December 17, 2018, and
        "The anticipated effective date of the rule is January 1, 2019. This date is
        subject to change."
      expression_date_note: 'printed bulletin date, "DATE: December 10, 2018"'
      source_as_of_note: official publisher retrieval date
      ocr_note: >-
        Page 1 is a scanned cover whose text layer is visible text drawn over the scan,
        not a new OCR run, and it misreads the cover: the row reads "EFFECTNE January 1.
        2019" for "EFFECTIVE January 1, 2019", "273.l" for "273.1", and "__K__" for the
        X marking "Proposed Regulation", runs the reference table together, and keeps
        only fragments of "Sean Brown, Deputy Commissioner" and "Economic Services
        Division" printed under the signature. Pages 2 and 3 are text PDF pages.
      authority_role: >-
        Announces the final proposed rule repealing the state 3SquaresVT rules
        (anticipated effective January 1, 2019): "Current program options and waivers
        will be maintained (subject to approval by the federal Food and Nutrition
        Service)." The department's response to comments (pages 2-3) says many or all
        program options are not part of the rules and that the 3SquaresVT Program
        Manual contains the state options and waivers. The bulletin does not itself
        state the child support election.
      index_url: https://dcf.vermont.gov/esd/laws-rules/proposed/archived-2017-21
