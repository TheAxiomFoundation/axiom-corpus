version: 2026-09-23-njdol-contribution-rates
# New Jersey Department of Labor and Workforce Development, Division of Employer
# Accounts: "Rate information, contributions, and due dates". The page publishes, per
# calendar year, the new-employer and worker contribution rates (UI, DI, WF/SWF, FLI)
# and the taxable wage bases, as the Department's notice of the amounts computed under
# N.J.S.A. 43:21-7 and the workforce fund provisions N.J.S.A. 34:15D-13 and 34:15D-22
# (companion statute scopes: manifests/us-nj-titles-34-43-payroll-contributions.yaml).
# The page is a rolling multi-year page (calendar 2015 through 2027 on the retrieval
# date) and each year's block states its own effective periods, so the expression date
# is the retrieval date rather than one rate year.
# Segmentation: every accordion card is one anchor range. The year labels sit inside
# the cards' <button> toggles, which the HTML extractor always drops, so each range
# carries its label and heading explicitly (the pattern of
# manifests/be-onss-employer-social-security-contributions-2025-documents.yaml).
