    extraction_note: A line-end hyphen is joined with a space ("Administrative Letter No. 11- 2004").
    citation_path_note: >-
      administrative-letters/economic-services/<year>/<number> follows the printed
      "DSS ADMINISTRATIVE LETTER ECONOMIC SERVICES NO. 6-2005"; no released NC scope
      holds administrative letters.
    authority_role: >-
      Reports that legally obligated child support paid "was changed to an income
      exclusion rather than an income deduction beginning January 1, 2005", with
      system automation from July 1, 2005. It also says "FSIS also uses Field 80N to
      calculate the LSO amount paid as an income deduction once the gross income test
      has been performed."
