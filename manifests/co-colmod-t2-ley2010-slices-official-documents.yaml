# 2026-07-23-co-colmod-t1-statutes, 385KB SUIN norm page) resisted
# encoding (sol whole-law deferral; 2-rule terra fragment salvaged). Per
# the full-document program (Egypt lane), the SAME SUIN page is
# re-captured in 6 titulo slices using the extractor's anchor_range HTML
# segmentation (html_start_selector/html_stop_selector with
# div.division :-soup-contains anchors (the SUIN norm page wraps each flow block in a division-classed div; the anchor must sit at sibling level for the range walk) on the unique in-body subject headings - the
# SUIN table-of-contents block uses bare "TITULO N" strings and cannot
# collide with the subject-qualified anchors). The t1 capture remains
# immutable; this t2 scope supersedes it for encoding.
