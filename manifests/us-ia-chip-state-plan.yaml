    summary: This letter reactivates Iowa's approved Evergreen Disaster Relief State Plan Amendment. The state will be waiving
      the collection of premiums for all CHIP beneficiaries through December 31, 2023. The state will then resume the standard
      premium and cost sharing policies for individuals who have completed a full renewal in the last 12 months. The state
      will resume the collection of premiums on a rolling basis as renewals are conducted through the state's COVID-19 PHE
      unwinding period, scheduled to end June 1, 2024.
