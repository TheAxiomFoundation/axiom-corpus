      source_note: >-
        The official January 2026 guide affirmatively states that South Dakota
        does not have a personal income tax. The guide separately identifies
        taxes that may apply to businesses. This intake supports the absence
        of natural-person personal income tax through the pre-credit tax
        stage. It does not certify a complete nonrefundable-credit,
        refundable-credit, or signed net-liability surface, and it does not
        cover business or entity taxes, payments, filing administration,
        local taxes, or nonresident allocation.
