    effective_date: '2023-05-12'
    summary: 'This letter reactivates Pennsylvania''s approved Evergreen Disaster Relief State Plan Amendment to include the
      following flexibilities: waiving the collection of premiums for all CHIP beneficiaries through July 31, 2023. The state
      will resume the standard premium and cost sharing policies for individuals who have completed a full renewal in the
      last 12 months. The state will resume the collection of premiums on a rolling basis as renewals are conducted through
      the state’s COVID-19 PHE unwinding period, scheduled to end February 29, 2024.'
    topics:
    - Cost Sharing
    - Disaster Relief
