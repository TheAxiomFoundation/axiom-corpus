    approval_date: '2020-06-18'
    effective_date: '2020-03-01'
    summary: This time-limited state plan amendment responds to the COVID-19 national emergency. The purpose of this amendment
      is to designate Contracted Community Partner organizations as qualified entities to make presumptive eligibility determinations;
      consider individuals evacuated from the state due to the emergency to continue to be residents; allow flexibility for
      mobile testing for COVID-19; and waive medication supply limits when appropriate to reduce exposure risk. In addition,
      this amendment will allow for changes in reimbursement policies and adjustment of payment rates for certain services
      and providers.
    topics:
    - Benefits
    - Disaster Relief
    - Eligibility
    - Financing & Reimbursement
    - Prescription Drugs
