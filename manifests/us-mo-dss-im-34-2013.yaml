    manual_sections_note: Paths are the released Missouri SNAP manual rows for the sections MANUAL REVISION #19 lists.
    extraction_note: The memo's three FM4A screen prints (images) are not retained.
    authority_role: >-
      Changes, effective March 18, 2013, how the existing child support exclusion
      applies when an ineligible or disqualified member's income is prorated: child
      support paid by all EU members is totalled and deducted first from that member's
      gross income, with any remainder deducted from eligible members' income; the 20%
      earned income deduction moves to after proration. It replaces the
      ineligible-member steps IM-39 (2003) prints.
    replaces_in_part: IM-39 (March 4, 2003), us-mo/guidance/dss/im-2003-39
