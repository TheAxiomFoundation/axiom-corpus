    expression_date_note: >-
      Memorandum date printed in its heading, 03/15/13. The memo says the change "will
      be in effect March 18, 2013", with a FAMIS adjustment of active cases that
      evening, and adverse action notices dated March 19, 2013 for changes effective
      April 2013. This memo is not the original adoption of the child support
      exclusion.
