      source_status: current_official_repeal_and_no_return_guidance
      certification_scope: hall_income_tax_scope_repeal_and_no_return
      source_note: >-
        Current Department of Revenue guidance states that the Hall income tax
        applied only to individuals and other entities receiving bond or note
        interest and stock dividends, was repealed for periods beginning
        January 1, 2021 or later, and must not be reported on a return for any
        tax year beginning on or after that date.

