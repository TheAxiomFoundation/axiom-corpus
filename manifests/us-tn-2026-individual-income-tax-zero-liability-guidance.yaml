      certification_scope: no_earned_income_tax_and_hall_tax_repeal
      source_note: >-
        Current Department of Revenue guidance states that Tennessee has no
        state income tax on earned income and no withholding requirement, and
        that the former Hall income tax on bond or note interest and stock
        dividends was repealed January 1, 2021.
