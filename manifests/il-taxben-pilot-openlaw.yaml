    alternate_version_sections:
      - "283"

  # The amending act as OpenLaw keeps it: every amending section reads "הנוסח
  # שולב ב…" because its text lives in the consolidated instruments, while the
  # commencement and application sections stand on their own.  §6 is the
  # commencement of amendment 288 to the Ordinance (פרק ג׳, ריווח מדרגות מס
  # הכנסה) — 1 January 2026 for income produced or accrued from that day — and is
  # the corpus provision a §121 encoding can cite for its version date.
  - source_id: economic-efficiency-law-2026
    jurisdiction: il
    document_class: statute
    instrument_slug: economic-efficiency-law-2026
    israel_law_id: "2242332"
    title: "חוק ההתייעלות הכלכלית (תיקוני חקיקה להשגת יעדי התקציב לשנת התקציב 2026), התשפ״ו–2026"
    title_en: "Economic Efficiency Law (Legislative Amendments for Achieving the Budget Targets for the 2026 Budget Year), 5786-2026"
