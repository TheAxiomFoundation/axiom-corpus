    source_file: economic-efficiency-law-2026-wikisource.html
    sha256: "c4632b9f2d50e63cdd4bd0ab517ec5aa1a0f1488448e6151d0eb6a7aedbb6c4c"
    source_as_of: "2026-09-06"
    # The act's own publication: ספר החוקים 3511, י״ג בניסן התשפ״ו (31.3.2026),
    # captured as ops/il-lane/sources/amend-2026-economic-efficiency-law-sefer-hachukim-3511.pdf
    # (sha256 4196057aa7d796bf64935647f4f3e3d02511fa00eaa215dc5ad914601b4e6583).  The
    # Knesset OData registry refused this session's queries (HTTP 474), so
    # LatestPublicationDate was not read for this act.
    expression_date: "2026-03-31"
    expression_date_basis: "ספר החוקים 3511 (31.3.2026), the act's publication, from the captured gazette PDF sha256 4196057aa7d796bf64935647f4f3e3d02511fa00eaa215dc5ad914601b4e6583; Knesset OData not consulted (HTTP 474 on 2026-09-06)"
    source_tier: consolidation-wikisource
