    source_as_of_note: official publisher retrieval date
    source_bytes_note: >-
      The publisher injects per-request tracking tokens (Dynatrace and Incapsula
      script parameters) into the page, so the retained bytes differ between fetches;
      the extracted text does not.
    extraction_note: The memo sits in one table cell, so the whole memo is one block; its in-text headings are bold, underlined text, not heading tags.
    authority_role: >-
      Changes the treatment of court-ordered child support paid: effective for budgets
      completed March 10, 2003, it is excluded from gross income before the 130%
      gross eligibility test; the memo's separate net-income steps subtract the 20%
      earned income deduction before child support.
    replaced_in_part_by: >-
      IM-34 (March 15, 2013), us-mo/guidance/dss/im-2013-34, which replaces this memo's
      budgeting steps for disqualified or ineligible members.
    later_history_note: >-
      The released Missouri SNAP manual's revision histories for the child support
      exclusion sections (us-mo/manual/dss/snap/1115-000-00/1115-035-00/1115-035-20
      and its subsections) list IM-111 (October 22, 2004), which is not retained here.
