    approval_date: '2020-05-22'
    effective_date: '2020-03-01'
    summary: 'This time-limited state plan amendment responds to the COVID-19 national emergency. The purpose of this amendment
      is to extend the reasonable opportunity period for certain non-citizens, allow hospital presumptive eligibility (PE)
      for additional groups and designates the State Medicaid Agency as a qualified entity for PE for MAGI groups, suspend
      all cost-sharing, modify the NF benefit to include health care isolation centers (HCIC) to provide COVID-related care
      for individuals who cannot safely remain at home or in a NF. It also suspends limits on private duty nursing services;
      allows physicians and other licensed practitioners, in accordance with state law, to order durable medical equipment;
      expands telehealth; and extends prior authorization for medications by automatic renewal without clinical review or
      time/quantity extensions. It also makes the following Payment changes: adds a telehealth originating site fee; increases
      payments for lab and NF services related to COVID; and increases limits on bed hold days. Finally, t designates COVID-19
      quarantine or isolation levels of care as categorical qualification for pre-admission screening; and suspends state
      plan staffing requirements for NF ventilator weaning.'
    topics:
    - Benefits
    - Cost Sharing
    - Disaster Relief
    - Eligibility
    - Prescription Drugs
    link_label: Approval Document
