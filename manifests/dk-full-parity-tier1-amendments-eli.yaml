# Target-selection rule: every class-A row carries each affected Tier-1 root.
# Small amendment blocks also carry every XML-named section.  For LOV 679,
# 1655, 198, 1627, and 1750, whose blocks amend dozens of sections, child paths
# are limited to XML-named provisions that set or coordinate a campaign rate,
# amount, threshold, base, eligibility rule, duration, or indexation.  The
# metadata.amends prose records the omitted diligence-only blocks.  Insertions
# use an extant base anchor when the newly numbered paragraph is absent from a
