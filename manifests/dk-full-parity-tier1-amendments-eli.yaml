# All 48 candidates were read from the offline LexDania XML and checked against
# the Tier-1 ELI graphs that selected them.  Class A (AMENDMENT-MARK) changes a
# provision used by DK_2025 or a campaign-dated parameter/eligibility encode;
# class B (DILIGENCE-ONLY) directly changes a Tier-1 law but only outside that
# parameter surface, so it is ingested with prose diligence and deliberately
# has no amendment_targets.  Class C (EXCLUDE) is empty: none of the 48 proved
# to be an out-of-scope-only graph candidate.
