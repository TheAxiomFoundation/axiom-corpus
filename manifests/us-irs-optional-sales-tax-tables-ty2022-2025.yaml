# IRS Optional State and Local Sales Tax Tables, tax years 2022-2025, from the
# official Instructions for Schedule A (Form 1040) PDFs (irs.gov/pub/irs-prior).
# These are the tables prescribed by the Secretary under 26 U.S.C.
# 164(b)(5)(H). Each year's PDF is captured as four single_block slices with
# page_windows: the line 5a instructions (with the State and Local General
# Sales Tax Deduction Worksheet), the state table, the local-table selector,
# and the local tables. Every slice of a year fetches the same URL.
#
# Text order: the table slices use `sort_text: true`, which keeps each printed
# table row on one line. The line 5a instructions and the local-table selector
# use the PDF content-stream order: on the two-column instruction pages a
# position sort interleaves the columns, and on the TY2022 selector page it
# runs the South Carolina county lists together.
#
# Text layer: bodies were extracted with PyMuPDF 1.26.7 (the uv.lock pin).
# See docs/ingest-runs/2026-09-24-irs-optional-sales-tax-tables.md.
