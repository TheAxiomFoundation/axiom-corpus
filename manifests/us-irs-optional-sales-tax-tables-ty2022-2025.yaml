      2. Follow the instructions on the next page to determine your local sales tax deduction.
      3. The California table includes the 1.25% uniform local sales tax rate. 4. This state
      does not have a local general sales tax. 5. The Nevada table includes the 2.25% uniform
      local sales tax rate. 6. The 4.0% rate for Hawaii is actually an excise tax.
