# A selector that selects no version of a (jurisdiction, document_class) pair its
# predecessor carries. replaced_by names the scopes the selector selects that carry
# the pair's text in its place; without it, reason says why nothing does.
dropped_pairs:
  - selector: uk-rulespec-2026-08-02
    predecessor: uk-rulespec-2026-07-26
    pair: uk-shropshire/manual
    listed_on: 2026-11-02
    reason: >-
      On main before the lineage check began. Its description retires the
      mislabeled uk-shropshire manual by omission: the manual's operative text is
      the 2024/2025 default scheme under a 2026/27 cover.
