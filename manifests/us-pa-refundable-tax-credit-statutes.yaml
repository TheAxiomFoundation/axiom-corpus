    metadata:
      source_authority: Pennsylvania General Assembly
      source_scope_note: >-
        Official current-as-amended HTML for The Fiscal Code Article XVI-W,
        Pennsylvania Child and Dependent Care Enhancement Tax Credit Program,
        and Article XVI-W.2, Working Pennsylvanians Tax Credit. The Article
        XVI-W source page reports revision on January 3, 2024. The article was
        added by Act 34 of 2023, effective December 13, 2023, and section
        1603-W(c) applies its 100 percent formula to taxable years beginning
        after December 31, 2022. The Article XVI-W.2 source page reports
        revision on December 3, 2025. That article was added by Act 45 of 2025,
        effective November 12, 2025, and section 1606-W.2 expressly applies it
        to taxable years beginning after December 31, 2024.
