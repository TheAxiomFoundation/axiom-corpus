version: '2026-09-10'
document_family: state_snap_policy_sources
program: SNAP
queue_status: in_progress
policy:
  canonical_pipeline: source-first
  source_policy: primary_official_only
  durable_artifacts:
  - sources
  - inventory
  - provisions
  - coverage
  forbidden_sources:
  - secondary summaries
  - State Options Reports
  - benefitswiki
  - policy manuals reposted by non-government sites
  - mirrors, proxies and archived copies of blocked publishers
  notes:
  - Completion pass for https://github.com/TheAxiomFoundation/axiom-corpus/issues/680 (SNAP discovery missed ~24 states).
    The 51-row manifests/state-snap-manual-agent-queue.yaml stays as released; this queue tracks the per-state completion
    rows.
  - Released SNAP scopes are immutable. Missing documents go into new per-state scopes, version 2026-09-10-snap-state-manual-completion,
    manifests/us-xx-snap-manual-completion.yaml, document_class per the state's existing convention.
  - 'A release rejects duplicate citation paths across scopes: every new document''s citation path is checked against every
    provisions JSONL of its jurisdiction before it is taken.'
  - 'Batch 1 (2026-09-10, axiom-corpus#680): ingestion-gap states FL, AL, MD, MA diagnosed against the released scopes, then
    discovery-gap states TX, CA, NY, NH, KY, ME checked on the publisher''s own index. Generator: scripts/build_snap_state_manual_completion_manifests.py.'
  - 'Batch 2 (2026-09-10, axiom-corpus#680, US network): KY and NY retried (KY answers, NY still bot-challenged); discovery-gap
    states NE, WY, AZ, AR, IA, HI, NM, VT, NV, ND attempted in the issue''s order, ID taken as the replacement for AZ (blocked
    on the first probe). Every publisher index was fetched live; revised editions of documents already in a released scope
    are recorded, not re-taken (their citation paths exist). Generator: scripts/build_snap_state_manual_completion_manifests.py
    --only us-ky --only us-wy --only us-nd.'
  - 'Batch 3 (2026-09-11, axiom-corpus#680, US network): the issue''s last seven discovery-gap states NC, OH, MT, OK, GA,
    TN, MI diagnosed against the released scopes and confirmed on the publisher''s own index; AZ and NY re-probed once (both
    still bot-challenged). Every index is already fully in the corpus, so no completion scope was built; revised editions
    since the released scopes are recorded for superseding scopes. Ohio''s OAC 5101:4 is complete (82 of 82 rules) and its
    eManuals host does not answer (blocked_primary_source for the manual family). Generator: scripts/build_snap_state_manual_completion_manifests.py
    --static-only.'
  - 'Superseding batch 1 (2026-09-11, US network): the revised editions recorded by batches 1-3 for NC, GA, TN, OK, MI and
    KY were taken as whole-manual re-extractions of the released manifests under new version strings 2026-09-11-<state>-snap-manual-supersede
    (released scopes untouched; the next selector swaps the released version for the superseding one). Document-level citation
    paths are identical to the released scopes; page/block sub-paths move where a revised edition changed its page or block
    count. See docs/ingest-runs/2026-09-11-snap-superseding-scopes-batch-1.md.'
  - 'Territories pass (2026-09-11, US network): PR (Reglamento 8684, the NAP eligibility regulation) and MP (FFY 2025 NAP
    block-grant MOU) extracted; GU and VI (SNAP) and AS (ASNAP) publish no manual or plan. Generator: scripts/build_snap_state_manual_completion_manifests.py
    --only us-pr --only us-mp --only us-gu --only us-vi --only us-as --corpus-base <corpus>.'
