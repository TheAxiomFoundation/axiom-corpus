# Dated Montana authority for married taxpayers filing separately, tax years 2021-2023.
#
# ARM 42.15.524 (itemized deductions of married taxpayers) governed how spouses who filed
# separate Montana returns divided itemized deductions until Montana tied its filing status
# to the federal one from tax year 2024. The rule was repealed effective 1/25/2025 (MAR
# Notice No. 42-1088). No locked scope carries it: the 42.15 scope taken from the current
# rules.mt.gov collection selects effective rules only, so it has no subchapter 5 rules.
# rules.mt.gov still serves every dated version of the rule. The text here is its official
# accessible HTML for version 30622, in effect from 4/30/2010 through 1/24/2025, which
# covers tax years 2021 through 2023. An Internet Archive capture of the former gateway page
# from October 2023 carries the same text and history and is recorded as corroboration.
#
# The row sits at a variant path, the sibling form schema/citation-path.v1.md section 4.0
# gives a dated version, so that a later ingest of the rule's current page keeps the plain
# path.
#
# Version is set on the command line; this key is documentation only:
