      source_note: >-
        Current official Title 43 text. Section 43.20.011 imposes the chapter
        tax on corporations. Section 43.20.012 expressly makes the tax
        inapplicable to individuals but permits an individual return for the
        credits in section 43.20.013. Section 43.20.013 provides resident
        political-contribution and federal dependent-care-linked credits and
        conditions payment on an appropriation. This intake proves zero
        individual tax through the pre-credit stage but does not certify a
        tax-year-2026 appropriation, current claim mechanics, refundable-credit
        amount, or signed net liability.
