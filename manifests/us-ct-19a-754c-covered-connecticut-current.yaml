      source_note: >-
        Exact current codified source unit for Section 19a-754c, the Covered
        Connecticut program (enacted June Sp. Sess. P.A. 21-2, S. 16; amended
        P.A. 22-118, S. 252 and P.A. 24-138, S. 16). The anchor range starts
        at the Section 19a-754c body heading and stops before Section
        19a-754d, excluding the chapter table of contents, sibling sections,
        and navigation. The section establishes the program within the
        Department of Social Services, requires premium and cost-sharing
        subsidies sufficient to ensure fully subsidized silver-level exchange
        coverage for eligible enrollees with household income up to 175 per
        cent of the federal poverty level (adults aged 19 to 64 on and after
        July 1, 2022), provides dental and nonemergency medical transportation
        services, and excludes program benefits from chapter 229 income. It
        supports the rulespec-us encoding at us-ct/statutes/19a-754c and the
        premium-subsidy oracle comparison against PolicyEngine-US
        ct_covered_connecticut.
