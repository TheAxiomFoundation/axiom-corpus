    official_number: "N 50-Ն"
    adopted: "2019-01-24"
    title: "ՀՀ ԿԱՌԱՎԱՐՈՒԹՅԱՆ ՈՐՈՇՈՒՄԸ ԸՆՏԱՆԵԿԱՆ ՆՊԱՍՏԻ, ՍՈՑԻԱԼԱԿԱՆ ՆՊԱՍՏԻ ԵՎ ՀՐԱՏԱՊ ՕԳՆՈՒԹՅԱՆ ՉԱՓԵՐԸ, 2024 ԹՎԱԿԱՆԻ ԸՆՏԱՆԵԿԱՆ ՆՊԱՍՏԻ ԵՎ ՍՈՑԻԱԼԱԿԱՆ ՆՊԱՍՏԻ ՀԱՄԱՐ ԸՆՏԱՆԻՔԻ ԱՆԱՊԱՀՈՎՈՒԹՅԱՆ ՍԱՀՄԱՆԱՅԻՆ ՄԻԱՎՈՐԸ ՍԱՀՄԱՆԵԼՈՒ ԵՎ 2024 ԹՎԱԿԱՆԻՆ ԸՆՏԱՆԵԿԱՆ ՆՊԱՍՏԻ, ՍՈՑԻԱԼԱԿԱՆ ՆՊԱՍՏԻ ԵՎ ՀՐԱՏԱՊ ՕԳՆՈՒԹՅԱՆ ՎՃԱՐՄԱՆ ՀԱՄԱՐ ՆԱԽԱՏԵՍՎԱԾ ՖԻՆԱՆՍԱԿԱՆ ՄԻՋՈՑՆԵՐԻ ՉԱՓԵՐՆ ԸՍՏ ՄԻԱՍՆԱԿԱՆ ՍՈՑԻԱԼԱԿԱՆ ԾԱՌԱՅՈՒԹՅԱՆ ՏԱՐԱԾՔԱՅԻՆ ԿԵՆՏՐՈՆՆԵՐԻ ՀԱՍՏԱՏԵԼՈՒ ՄԱՍԻՆ"
    source_url: "https://www.arlis.am/hy/acts/188042"
