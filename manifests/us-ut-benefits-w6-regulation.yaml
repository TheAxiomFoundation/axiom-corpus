    source_url_note: Repaired 2026-10-20. The Office of Administrative Rules relaunched eRules v1.0.0 on 2026-10-16, and the
      addresses this row used before (/public/rule/R994-401/Current%20Rules and the /api/public/getfile/uac-html/... download)
      both answer HTTP 404. The replacement is one address, the new rule page, whose trailing /undefined segment is required,
      because /Rule/2241/51/4501 alone answers 404. The page server-renders the publisher's own converted rule HTML (Aspose
      div.awdiv / span.awtext1), so html_content_selector div[class$='_ruleHtml'] replaces the earlier body selector and keeps
      the page's own chrome out of the block; the CSS-module hash prefix changes per build, so the selector matches the stable
      _ruleHtml suffix. The plain corpus client reads the full body, so the browser user agent and the curl range backend
      are no longer needed and the separate download_url is gone. The rule record now comes from POST /api/search and POST
      /api/ruleVersion, which still name htmlName ffc52bcf-88e1-4d58-a0c3-a18af6a6e3b6.html and effectiveDate 04/21/2022,
      so this is the same rule version the 2026-10-06 run took. The new /api/storage/<file> route answers HTTP 500 for every
      file name, so no direct file route is used.
