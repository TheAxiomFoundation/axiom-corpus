      source_note: >-
        The current official Wyoming Constitution requires any tax imposed on
        income to allow a full credit for sales, use, and ad valorem taxes
        paid by the same taxpayer to any Wyoming taxing authority in the
        taxable year. This higher-authority boundary does not itself impose an
        income tax or prove that every downstream credit and signed
        net-liability output is zero. It is preserved as the constitutional
        check on the current official sources that affirmatively state that
        Wyoming has no individual or state income tax.
