# Egypt (eg) tranche-1 capture, STATUTE class - EGYMOD v1.0 parity
# (policy years 2019-25; SOUTHMOD full-bundle program lane 8; report
# CR-EGYMOD-v1.0). FULL-DOCUMENT capture: per Max's directive the three
# instruments are captured in their ENTIRETY, sliced per structural unit
# (kitab/bab) via single_block page_windows so every slice is an
# independently encodable citation - the union of slices covers each
# whole document.
#
# EGYMOD simulates (S): personal income tax under Law 91/2005 (2019
# credit regime; 2020-25 progressive-with-phase-out regimes governed by
# amendment Laws 26/2020, 30/2023, 7/2024 - tranche-2 captures; annual
# personal exemption EGP 7,000 (2019) rising to 20,000 (2024-25);
# phase-out tiers over EGP 600,000 with ceiling 1,000,000/1,200,000),
# social insurance contributions under Law 148/2019 (unified regime
# 2020+: employee 11 percent / employer 18.75 percent of insurable
# salary by branch - old age 9/12, sickness 1/3.25, end-of-service 1/1,
# work injury -/1.5, unemployment -/1 - with monthly insurable-salary
# caps; 2019 dual-component regime under the predecessor Law 79/1975),
# VAT under Law 67/2016 (14 percent general rate; schedule tax), and the
# Takaful & Karama cash transfers (statutorily codified by Law 12/2025 -
# NO publicly hosted official copy located: the ELP portal holds it
# behind subscription; gazette No. of April 2025; TOP tranche-2 gap.
# The 2019-24 modeled T&K systems operated administratively).
#
# Sources (all official; all image-only or broken-glyph text layers,
# hence force_ocr ara at 400 dpi - Arabic diacritics and structure OCR
# cleanly; numeral-heavy provisions carry OCR risk and encode gates
# handle ungrounded values honestly):
# 1. Law 91/2005 (income tax): Egyptian Tax Authority hosted print of
#    the gazette text (71 pp scan, no text layer).
# 2. Law 148/2019 (social insurance and pensions): NOSI official book
#    print "Kitab al-Qanun al-Jadid" (155 pp; 1st edition Sept 2019;
#    gazette No. 33 bis (a) of 19 Aug 2019 is the underlying
#    publication; broken-glyph text layer bypassed by OCR).
# 3. Law 67/2016 (VAT): Egyptian Tax Authority guide print carrying the
#    statute text side-by-side with the Unified Tax Procedures Law
#    cross-references (72 pp; broken-glyph text layer; slice titles note
#    the guide format).
