    effective_date: '2024-10-01'
    summary: Through this SPA, the state makes several updates to benefits under the CHIP state plan and updates its strategic
      objective goals related to CHIP enrollment and removes an outdated performance goal. Additionally, the state has demonstrated
      compliance with the Inflation Reduction Act (IRA) section 11405(b)(1) to cover adult vaccines, without cost sharing.
      This SPA also documents the state’s compliance with the longstanding requirement to cover children’s vaccines under
      current regulations at 42 CFR §§ 457.410(b)(2) and 457.520(b)(4), which requires states to cover age-appropriate vaccines
      in accordance with the recommendations of the ACIP without cost sharing.
