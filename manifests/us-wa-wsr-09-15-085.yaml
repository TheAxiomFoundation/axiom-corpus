    effective_date_note: The printed August 14, 2009 effective date is moved to November 15, 2009 by WSR 09-16-095, separately retained.
    expression_date_note: Filing date printed in the register document header; path date is this filing date, not an inferred issue publication date.
    source_as_of_note: official publisher retrieval date
    citation_path_note: >-
      The WSR HTML prints no register issue date, so the path's date segment is the
      printed filing date, unlike the publication-date segment of the Delaware and
      Louisiana register paths.
    source_bytes_note: The publisher serves a rendering last modified 2012-09-05 (HTTP Last-Modified), not a 2009 capture.
    amendment_convention: >-
      The register prints deleted text struck through inside literal double
      parentheses, which stay in the body around the [-...-] run, and inserted text
      underlined, written {+...+}. The underlined "AMENDATORY SECTION" label is
      typography and excluded by the inserted_selector.
    authority_role: >-
      Amends WAC 388-450-0015 to add, For Basic Food only, legally obligated current or
      back child support paid to someone outside the assistance unit to the income
      "we do not count"; the Purpose statement calls this an income exclusion prior to
      the gross income test. Read with WSR 09-16-095 for the postponed effective date.
