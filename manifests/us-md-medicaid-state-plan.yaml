    summary: 'CMS is approving this time-limited state plan amendment to allow the state to implement temporary policies while
      returning to normal operations after the COVID-19 national emergency. The purpose of this amendment is to continue a
      premium resumption delay for the following group from the day after the end of the federal PHE through December 31,
      2023: Employed Individuals With Disabilities (§1902(a)(10)(A)(ii)(XV) TWWIIA Basic group) and a premium resumption delay
      for the following group from the day after the end of the PHE through April 30, 2024: Maryland Children''s Health Program
      (MCHP) (§1902(a)(10)(A)(ii)(XIV) targeted low-income children).'
