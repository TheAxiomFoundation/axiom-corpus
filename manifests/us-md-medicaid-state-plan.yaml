    approval_date: '2011-12-16'
    effective_date: '2011-10-01'
    summary: This SPA, in accordance with Section 113 of the Childrens Health Insurance Program Reauthorization Act (CHIPRA),
      eliminates the previous requirements for deemed newborn Medicaid eligibility that the newborn must come home from the
      hospital to live with the mother, remain a member of the mothers household, and that the mother remain eligible for
      Medicaid, or would remain eligible if still pregnant. By virtue of this change, all newborns born to women covered by
      Medicaid for the child's birth, including coverage of an alien for labor and delivery as emergency medical services,
      are now covered as mandatory categorically needy.
