      (management and evaluation service for adults with SMI; well-check service for children and adults with developmental
      disabilities); adjust benefits currently in the state plan (exempt certain services from annual limits when associated
      with testing or treatment of COVID-19); allow 90-day supplies of drugs and early refills; allow exceptions to the State's
      preferred drug list in case of shortages; establish payments for the new optional benefits; increase rates for direct
      care services and day habilitation; establish payments for delivering existing services through telehealth; and establish
