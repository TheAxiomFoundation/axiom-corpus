      source_authority: Wyoming Legislative Service Office
      document_subtype: legislative_research_short_report
      program: individual_income_tax
      tax_year: "2026"
      publication_date: "2026-05"
      source_status: current_official_2026_lso_report
      certification_scope: state_income_tax_pre_credit_absence
      final_return_certification: false
      source_note: >-
        The official May 2026 Wyoming Legislative Service Office report states
        that Wyoming does not have a state income tax and explains that neither
        sweepstakes-casino operators nor players are taxed by the state. This
        current legislative research source corroborates the state portal's
        explicit individual-income-tax absence for tax year 2026. It does not
        certify a complete nonrefundable-credit, refundable-credit, or signed
        net-liability surface, and it does not establish the treatment of
        business or entity taxes, payments, filing administration, local
        taxes, or nonresident allocation.
