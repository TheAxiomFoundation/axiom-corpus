      section_heading: State of Wyoming individual income-tax absence
    metadata:
      primary_source: true
      source_authority: State of Wyoming
      document_subtype: current_state_portal
      program: individual_income_tax
      tax_year: "2026"
      page_updated_at: "2025-10-16T19:49:55Z"
      source_status: current_official_state_portal
      certification_scope: individual_income_tax_pre_credit_absence
      final_return_certification: false
      source_note: >-
        The current official State of Wyoming portal affirmatively states that
        Wyoming does not possess an individual or corporate income tax. The
        page was last updated October 16, 2025 and displays a 2026 State of
        Wyoming copyright. This intake supports the absence of a tax-year-2026
        resident individual income tax through the pre-credit tax stage. It
        does not certify a complete nonrefundable-credit, refundable-credit,
        or signed net-liability surface, and it excludes business and entity
        taxes, payments, filing administration, local taxes, and nonresident
        allocation.

