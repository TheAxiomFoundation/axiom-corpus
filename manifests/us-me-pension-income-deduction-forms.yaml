      source_authority: Maine Revenue Services
      source_sha256: 00f731e053a19cc464595fbf38d61e11daa1e3e5a7bed525708a12d9b426051d
      document_subtype: individual_income_tax_return_instructions
      form: Form 1040ME
      program: individual_income_tax
      tax_year: "2025"
      source_status: official_tax_year_2025_general_instructions_with_conformity_cover_page
      certification_scope: schedule_1s_line_4_pension_income_deduction_instructions_only
      final_return_certification: false
      rulespec_semantics: not_asserted
      policyengine_parity: not_asserted
      statutory_basis: 36 M.R.S. §5122(2)(M-2)
      pension_income_deduction_maximum_2025: "48216"
      line_4_pension_income_deduction: >-
        Page 8, Schedule 1S line 4 instructions: "Enter the pension income
        deduction from the Pension Income Deduction Worksheet, line P10.
        Include copies of your 1099 forms to verify the subtraction. Enclose
        worksheet. 36 M.R.S. § 5122(2)(M-2)." The instructions state that you
        and your spouse (if married) may each deduct up to $48,216 of other
        eligible pension income that is included in federal adjusted gross
        income, and that "The $48,216 cap must be reduced by any social
        security and railroad retirement benefits received, whether taxable or
        not." Benefits received under a United States military retirement
        plan, including survivor benefits, are stated to be fully exempt.
      conformity_cover_page_note: >-
        Page 1 is an MRS "IMPORTANT UPDATE" cover page stating that Maine
        conforms to the Internal Revenue Code as of December 31, 2024, that
        federal Public Law 119-21 changes are expected to be considered in the
        Second Regular Session of the 132nd Maine Legislature, and that the
        2025 returns and instructions were developed under the Governor's
        directive pending conformity legislation.
      source_note: >-
        Official 13-page 2025 Form 1040ME general instructions (2025 Maine
        Resident Individual Income Tax Booklet) with the MRS conformity cover
        page. Taken for the page 8 Schedule 1S line 4 instructions, which state
        the tax-year-2025 $48,216 pension income deduction cap and its
        reduction by social security and railroad retirement benefits under
        36 M.R.S. §5122(2)(M-2), requested by
        TheAxiomFoundation/rulespec-us#1419. This intake preserves the official
        instructions and does not certify final-return liability, RuleSpec
        semantics, or PolicyEngine parity.
