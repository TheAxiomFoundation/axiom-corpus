      source_sha256: f158b7ef00c8f1bc27c8c35a65d5478dd410804b30afb20f279e3a81d9e5ca0a
      document_subtype: individual_income_tax_schedule
      form: Schedule 1S (Form 1040ME)
      attachment_sequence_number: "5"
      program: individual_income_tax
      tax_year: "2025"
      source_status: official_tax_year_2025_schedule
      certification_scope: pension_income_deduction_worksheet_only
      final_return_certification: false
      rulespec_semantics: not_asserted
      policyengine_parity: not_asserted
      statutory_basis: 36 M.R.S. §5122(2)(M-2)
      pension_income_deduction_maximum_2025: "48216"
      worksheet_line_p2_maximum_allowable_deduction: >-
        Page 2, "Worksheet for Pension Income Deduction - Schedule 1S, Line 4",
        line P2 "Maximum allowable deduction" prints 48,216.00 in both the
        Taxpayer and Spouse columns. Line P1 is total eligible non-military
        pension income (both Maine and non-Maine sources) included in federal
        adjusted gross income (from federal Form 1040, lines 4b and 5b or Form
        1040-SR, lines 4b and 5b); line P3 is total social security and
        railroad retirement benefits received, whether taxable or not; line P4
        subtracts P3 from P2 (if zero or less, enter zero); line P5 is the
        smaller of P1 or P4; line P9 is total eligible military retirement pay
        included in federal adjusted gross income; line P10 adds P8 and P9.
      worksheet_phaseout_caution: >-
        The worksheet's CAUTION states that if Form 1040ME, line 14 is more than
        $125,000 if single or married filing separately, $187,500 if head of
        household, or $250,000 if married filing jointly or qualifying surviving
        spouse, the Worksheet for Phaseout of Non-Military Pension Income
        Deduction must be completed.
      source_note: >-
        Official 2-page 2025 Form 1040ME Schedule 1S (Income Subtraction
        Modifications, attachment sequence no. 5), whose page 2 carries the
        Worksheet for Pension Income Deduction for Schedule 1S, line 4. Taken
        for worksheet line P2, which publishes the tax-year-2025 maximum
        allowable pension income deduction of $48,216 under
        36 M.R.S. §5122(2)(M-2), requested by
        TheAxiomFoundation/rulespec-us#1419. This intake preserves the official
        schedule and does not certify final-return liability, RuleSpec
        semantics, or PolicyEngine parity.
