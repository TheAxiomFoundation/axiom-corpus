      line_2_pension_income_deduction_note: >-
        Page 2, 2026 Estimated Tax Worksheet, line 2 (Deduct - income
        subtraction modifications included in line 1. See the 2025 Form 1040ME,
        Schedule 1S.): "Note that the maximum pension income deduction is
        increased to $49,824 for tax year 2026." followed by "The maximum
        pension income deduction is equal to the annual social security benefit
        for an individual at the retirement age, as defined in 42 USC § 416(l),
        as of January 1, 2026."
      source_note: >-
        Official 6-page 2026 Form 1040ES-ME instructions (Revised: July 2026)
