# Maine Revenue Services (MRS) individual income tax forms and instructions that
# publish the Maine pension income deduction amount defined by
# 36 M.R.S. §5122(2)(M-2)(2)(d)(iv) (the maximum annual Social Security benefit
# for an individual at retirement age as of January 1 of the tax year):
# $49,824 for tax year 2026 (2026 Form 1040ES-ME, page 2, line 2 note) and
# $48,216 for tax year 2025 (2025 Form 1040ME Schedule 1S, page 2, worksheet
# line P2; 2025 Form 1040ME instructions, page 8, line 4). Requested by
# TheAxiomFoundation/rulespec-us#1419, which encodes §5122(2)(M-2) and needs
# the MRS-published amounts as primary sources.
#
# One `form` scope, version 2026-09-26-me-pension-income-deduction-forms:
#
#   uv run --extra dev axiom-corpus-ingest extract-official-documents \
#     --base data/corpus \
#     --version 2026-09-26-me-pension-income-deduction-forms \
#     --manifest manifests/us-me-pension-income-deduction-forms.yaml
#
# Conventions follow manifests/us-wi-2025-schedule-sb-instructions.yaml (official
# PDF, single_block, form class, line statements checked against the PDF text)
# and the state-form citation-path shape us-xx/form/<agency>/ty<year>/<id> used
# by scripts/build_tax_forms_manifests.py and the 2026-09-14-ty2026-indexed-amounts
# scopes (agency acronym slug: ador, cdor, drs, idr, istc...; here `mrs`).
# `source_as_of` is the retrieval date; `expression_date` is January 1 of the
# document's tax year, as the WI Schedule SB and CT-1040ES manifests do.
