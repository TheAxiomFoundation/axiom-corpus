    cms_record_url: https://www.medicaid.gov/chip/state-program-information/chip-spa?filter%5Bnid%5D%5Beq%5D=191961
    approval_date: '2026-04-20'
    effective_date: '2022-07-01'
    summary: This SPA demonstrates compliance with requirements in the American Rescue Plan Act of 2021 (ARP) that 1) mandate
      coverage of COVID-19 testing, treatment, and vaccines and their administration without cost-sharing or amount, duration,
      or scope limitations; and 2) require states to cover, without cost sharing, the treatment of conditions that may seriously
      complicate COVID- 19 treatment, during the period when a beneficiary is diagnosed with or is presumed to have COVID-19.
      Additionally, through this SPA, the state eliminates the HUSKY Plus program and incorporates all services previously
      provided to a subset of children into the existing HUSKY B program, with the exception of non-emergency medical transportation.
    topics:
    - Benefits
    link_label: Approval Package
