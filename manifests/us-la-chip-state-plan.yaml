    effective_date: '2025-10-01'
    summary: Through this SPA, the state amends the provisions governing the Federally Facilitated Marketplace (FFM) eligibility
      determinations. Louisiana will transition from a FFM Determination state where the state delegated authority to the
      FFM to make final eligibility decisions, to an FFM Assessment state where the FFM will make a preliminary assessment
      of eligibility and the State will make the final decision.
