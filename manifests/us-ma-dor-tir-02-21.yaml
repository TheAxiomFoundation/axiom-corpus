      discovered_via: >-
        manual-review 2026-09-23: PolicyBench root cause r22 (Part A dividends
        taxed without the short-term capital loss offset); DOR's release on the
        St. 2002, c. 186 and c. 364 capital gain and loss changes
      source_note: >-
        DOR release dated January 2, 2003, explaining the capital gain and loss
        changes of St. 2002, c. 186 and St. 2002, c. 364 for tax years beginning
        on or after January 1, 2002. It lists the order in which Part A
        short-term capital losses and Part C long-term capital losses apply
        against Part A capital gains and Part A interest and dividends, citing
        G.L. c. 62, s. 2(c)(2)(a), 2(c)(2)(b) and 2(c)(4), including the $2,000
        aggregate limit against Part A interest and dividends. The release
        describes the law as of 2002; the retained statute scope is the current
        text.
