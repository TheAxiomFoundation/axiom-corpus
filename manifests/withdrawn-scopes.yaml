# Scopes no new release may select (docs/release-gate-policy.md).
#
# validate_release fails any release that selects a scope listed here, unless
# the release is one of the scope's grandfathered selectors or exceptions.
# withdrawn_on is the decision; listed_on is the day the entry was written.
# Tracked selectors are immutable, so every selector that reached main before
# the entry did and selects the scope keeps it (some were cut after the
# decision, before the gate existed). Each allowance is pinned to the selector's
# digest (axiom_corpus.release.manifest.selector_sha256) in selector_digests, so
# it cannot follow a selector that changes. A selector that reaches main after
# the entry may keep a withdrawn scope only as an entry under the scope's
# exceptions, with a reason; that is a release decision.
#
# Each entry records why the scope is withdrawn, the decision and run note that
# withdrew it, and what a new cut does instead: replace_with lists the scopes to
# select in its place; carried_by lists scopes that already carry its text, so
# it is simply dropped. tests/test_release_policy_repository.py checks that every
# named scope is locked, every run note exists, and every tracked selector that
# selects a withdrawn scope is listed.

