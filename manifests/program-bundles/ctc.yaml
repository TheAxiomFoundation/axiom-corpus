- id: screener
  title: Screener-level parity
  definition: Every provision PolicyEngine-US cites for the program in the state is encoded, or its document is
    excluded with a recorded reason, and the comparison against the newest PolicyEngine release has no unfixed Axiom
    errors. Federal law PolicyEngine cites is shared by every state.
  membership:
    rule: The PolicyEngine-US references of the release it was built from (the newest, by default) and the plan's
      documents, each in the layer of the law it names, grouped into documents
    references: sources/policyengine-us/ctc-references.json
    policyengine_us_release: latest
    policyengine_us_version: 2.29.11
    policyengine_us_commit: 4c900b6d3d808c4a9cf56d11afcedad9898f732f
    policyengine_us_folders:
    - gov/irs/credits/ctc
    - gov/irs/credits/ctc_tax_liability_limit
    policyengine_us_state_folders: ^tax/income/credits/(ctc|child_tax_credit|young_child)
    references_derived_by: scripts/export_policyengine_references.py
    reference_count: 162
    plan: sources/plans/m1-plan-documents.json
    plan_source: TheAxiomFoundation/axiom-roadmap-dashboard@c93d4a62bb026df0ec8ba8745ec1fe96295d23b1:docs/strategy/m1-pe-parity-2026-09-29/document-sizing.json
    plan_documents: 0
    fiscal_year: 2027
    outside_the_states: {}
    in_scope_by_layer:
      federal: 19
      state: 83
- id: full
  title: Full document bundle
  definition: 'Every relevant document for the program in the state: every document of the screener tier, the federal
    law of the program (statute, regulations and federal guidance), and every primary source of the state''s own
    rules. A document the corpus does not hold yet stays in the tier and counts as not in the corpus.'
  membership:
    rule: Every in-scope document of the screener tier; the federal law of the program, section by section, from
      its needs-closure schema, and its federal guidance manifests; each state's own sources from its manifests
      for the program; and the sources the config knows the corpus does not hold yet
    federal_schema: docs/coverage/needs-closure-2026-09-14/tax-schema.yaml
    federal_manifests: ^us-irs-(guidance|individual)
    state_manifests: (^|-)ctc(-|$)|child-tax-credit
    known_sources: 0
    in_scope_by_layer:
      federal: 67
      state: 83
