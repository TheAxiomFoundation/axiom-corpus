  definition: 'Every relevant document for the program in the state: every document of the screener tier, the federal
    law of the program (statute, regulations and federal guidance), and every primary source of the state''s own
    rules. A document the corpus does not hold yet stays in the tier and counts as not in the corpus.'
  membership:
    rule: Every in-scope document of the screener tier; the federal law of the program, section by section, from
      its needs-closure schema, and its federal guidance manifests; each state's own sources from its manifests
      for the program; and the sources the config knows the corpus does not hold yet
    federal_schema: docs/coverage/needs-closure-2026-09-14/chip-schema.yaml
