      source_url_note: >-
        Repaired 2026-10-20. The Office of Administrative Rules relaunched eRules v1.0.0 on 2026-10-16, and
        every /public/rule/ and /api/public/getfile/ address answers HTTP 404. source_url is the new rule
        page; its trailing /undefined segment is required, because /Rule/2196/51/4835 alone answers 404. The
        page server-renders the publisher's own converted rule HTML (Aspose div.awdiv / span.awtext1), read
        with html_content_selector div[class$='_ruleHtml']; the CSS-module hash prefix changes per build, so
        the selector matches the stable _ruleHtml suffix. The plain corpus client reads the full body, so the
        earlier curl range-fetch request options are no longer needed. The rule record comes from
        POST /api/search {"searchTerm": "R986-200", "ruleTypeId": 51} and
        POST /api/ruleVersion {"ruleTypeId": 51, "versionIds": [4835]}, which still name
        htmlName 1a059e78-4927-4528-9bcd-97c534cd51cf.html and effectiveDate 10/24/2022, so this is the same
        rule version the 2026-07-02 run took. The new /api/storage/<file> route answers HTTP 500 for every
        file name, including that htmlName, so no direct file route is used.
      source_discovery_group: us-ut/regulation/tanf
