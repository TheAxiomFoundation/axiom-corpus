  notes: 'Family: CMS Internet-Only Manuals. Pub 100-01 (Medicare General Information, Eligibility and Entitlement Manual)
    taken in full: 7 chapter PDFs from the publication page listed on the IOM index; the Crosswalks PDF on the same page is
    a finding aid, not a chapter, and is not taken. The existing us/guidance/cms/original-medicare-part-a-b scope is not re-ingested.
    Pub 100-02 (Benefit Policy), Pub 100-04 (Claims Processing) and Pub 45 (State Medicaid Manual) are candidate later families;
    cms.gov fact sheets, medicare.gov pages, SSA POMS and state pages on the lead list are not CMS manuals and stay out of
    this family. Pub 100-24 (State Payment of Medicare Premiums, the Part A/Part B buy-in manual) taken in full: 6 chapter
    PDFs from its publication page; the ''100-24 Table of Contents'' PDF on the same page is a finding aid, not a chapter,
    and is not taken. Its appendices (1.A-1.D, 5.A-5.D, 6.A-6.B) are bold sections with their own transmittal lines and are
    emitted as sections labeled by appendix code. Pub 100-02 (Medicare Benefit Policy Manual, the benefit coverage rules)
    taken in full: 17 chapter PDFs from its publication page; the 16 per-chapter crosswalk PDFs on the same page are finding
    aids and are not taken. Chapter 7''s TOC lists 30.2.8 Facsimile Signatures and chapter 11''s TOC lists 100.6.1 Dialysis
    Modality; both are printed in the body with a stray space or dot in the label and are recovered with text replacements.
    Pub 100-04 (Medicare Claims Processing Manual) taken: 39 chapter PDFs (chapters 1-39) from its publication page; the two
    ''Chapter 21 - Medicare Summary Notices - English/Spanish Exhibits'' links are ZIP bundles of MSN exhibit images, not
    chapter text, and the 29 per-chapter crosswalk PDFs are finding aids; none of those are taken. Several chapter TOCs list
    sections the body no longer prints (for example chapter 8''s 50.1.5 to 100.3 and chapter 18''s 1 and 1.1); the body governs.'
