  notes: 'Family: CMS Internet-Only Manuals. Pub 100-01 (Medicare General Information, Eligibility and Entitlement Manual)
    taken in full: 7 chapter PDFs from the publication page listed on the IOM index; the Crosswalks PDF on the same page is
    a finding aid, not a chapter, and is not taken. The existing us/guidance/cms/original-medicare-part-a-b scope is not re-ingested.
    Pub 100-02 (Benefit Policy), Pub 100-04 (Claims Processing) and Pub 45 (State Medicaid Manual) are candidate later families;
    cms.gov fact sheets, medicare.gov pages, SSA POMS and state pages on the lead list are not CMS manuals and stay out of
    this family. Pub 100-24 (State Payment of Medicare Premiums, the Part A/Part B buy-in manual) taken in full: 6 chapter
    PDFs from its publication page; the ''100-24 Table of Contents'' PDF on the same page is a finding aid, not a chapter,
    and is not taken. Its appendices (1.A-1.D, 5.A-5.D, 6.A-6.B) are bold sections with their own transmittal lines and are
    emitted as sections labeled by appendix code. Pub 100-02 (Medicare Benefit Policy Manual, the benefit coverage rules)
    taken in full: 17 chapter PDFs from its publication page; the 16 per-chapter crosswalk PDFs on the same page are finding
    aids and are not taken. Chapter 7''s TOC lists 30.2.8 Facsimile Signatures and chapter 11''s TOC lists 100.6.1 Dialysis
    Modality; both are printed in the body with a stray space or dot in the label and are recovered with text replacements.
    Pub 100-04 (Medicare Claims Processing Manual) taken: 39 chapter PDFs (chapters 1-39) from its publication page; the two
    ''Chapter 21 - Medicare Summary Notices - English/Spanish Exhibits'' links are ZIP bundles of MSN exhibit images, not
    chapter text, and the 29 per-chapter crosswalk PDFs are finding aids; none of those are taken. Several chapter TOCs list
    sections the body no longer prints (for example chapter 8''s 50.1.5 to 100.3 and chapter 18''s 1 and 1.1); the body governs.
    2026-09-13: 42 CFR parts 406, 407, 408 and 423 taken as us/regulation 2026-09-13-title-42-part-<p> (see the four federal_regulation_ecfr
    rows below and docs/ingest-runs/2026-09-13-federal-cfr-layer.md). 2026-09-13 closure run (needs-closure-2026-09-11 MED-F-POMS-HI):
    SSA POMS part HI taken whole (11 chapters, 922 sections) as scope us/manual/2026-09-13-medicare-poms-hi, citation path
    us/manual/ssa/poms/hi/<section>, through scripts/build_ssi_poms_si_manifests.py --family hi. Pub 100-18 (Medicare Prescription
    Drug Benefit Manual: Part D benefits, formulary, LIS, coordination of benefits) taken as posted: the IOM publication page
    links only the two-page table of contents (pub100_18.pdf, not a chapter and not taken); the chapter PDFs (5, 6, 7, 9,
    12, 13, 14) are on the publisher''s Prescription Drug Benefit Manual page. Chapters 1, 8, 16 and 17 are reserved; 10,
    11 and 15 have not been disseminated via Pub 100-18; chapter 2 (communications and marketing), chapter 3 (eligibility
    and enrollment) and chapter 4 (creditable coverage) are published as standalone CMS guidance documents (Medicare Communications
    and Marketing Guidelines, the CY C/D Enrollment and Disenrollment Guidance, the creditable-coverage guidance pages), not
    as manual chapters; chapter 18 is the Parts C & D Enrollee Grievances, Organization/Coverage Determinations, and Appeals
    Guidance linked on the same page and is recorded, not taken as a chapter. 2026-09-13 closure run (needs-closure-2026-09-11
    MED-F-IOM-100-18). 2026-09-13 closure run (needs-closure-2026-09-11 MED-F-ANN-*): the CY 2026 Part A premium, Part A deductible
    and Part B premium Federal Register notices (govinfo), the CMS premiums fact sheet, the Part D bid information fact sheet
    and national average bid announcement, the CY 2026 Rate Announcement (Part D defined standard benefit parameters), the
    CY 2026 LIS resource limits memorandum and the CY 2026 MA/Part D enrollment and disenrollment guidance (the successor
    of Pub 100-18 chapter 3). Pub 100-16 (Medicare Managed Care Manual, the Part C eligibility, enrollment, benefits and beneficiary
    protection rules) taken as posted: 25 chapter PDFs on its publication page (chapters 1, 3-15, 16a, 16b, 17a-17d, 17f,
    18a-18c, 21; chapters 2, 17e, 19 and 20 are not posted), of which 23 carry text; chapters 3 (marketing) and 13 (grievances
    and appeals) are one-page pointers to standalone cms.gov guidance and are recorded, not taken. Chapter 21 is the joint
    compliance program chapter also posted as Pub 100-18 chapter 9. 2026-09-13 closure run (needs-closure-2026-09-11 MED-F-IOM-100-16).
    Pub 100-03 (Medicare National Coverage Determinations Manual, the NCD text by section) taken in full: its one chapter,
    Coverage Determinations, is posted as four part PDFs (part 1 sections 10-80.12, part 2 90-160.26, part 3 170-190.34, part
    4 200-310.1), each a document keyed chapter-1-part-N; the two CIM/NCD crosswalk PDFs on the same page are finding aids
    and are not taken. 2026-09-15 wave-5 closure run (needs-closure-2026-09-14 MED-F-IOM-100-03). Pub 100-05 (Medicare Secondary
    Payer Manual) taken as posted: chapters 1, 2, 3, 5, 6 and 7 (chapter 7 is posted under /files/document/); chapters 4 (COBC
    requirements) and 8 (affiliated contractor interaction with MSP RACs) were deleted by transmittal R11756MSP of 2022-12-22,
    their PDFs print only the transmittal table (chapter 8 adds ''This chapter is obsolete and is not being used'') and they
    are recorded, not taken; the ''Chapter 5.1 ECRS Web User Guide'' and ''Chapter 5.2 ECRS Quick Reference Card'' attachments
    and the eight per-chapter crosswalks are not chapters and are not taken. 2026-09-15 wave-5 closure run (needs-closure-2026-09-14
    MED-F-IOM-100-05).'
