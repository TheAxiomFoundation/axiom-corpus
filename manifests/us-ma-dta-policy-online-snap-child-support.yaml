      last_update: "2023-01-05"
      expression_date_note: the page's own "Last Update" line (January 5, 2023)
      authority_role: >-
        DTA operational policy on child support expenses: legally obligated child support paid
        for a nonhousehold member is subtracted from gross income for the gross income test (the
        page cites 106 CMR 364.370 for that test) and then allowed as a deduction in the SNAP
        benefit calculation. The same exclusion is codified at 106 CMR 363.230(O)
        (us-ma/regulation/106-cmr/363/230).
