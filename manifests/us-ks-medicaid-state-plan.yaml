    approval_date: '2022-10-14'
    effective_date: '2022-07-01'
    summary: CMS is approving this time-limited state plan amendment to respond to the COVID-19 national emergency. The purpose
      of this amendment is to rescind the authorities regarding Presumptive Eligibility (PE) authorized in sections B.1, B.2,
      and B.3 of DR SPA KS-20-0012. This will revert the State back to the practice of one PE period for parents or caretaker
      relatives, children, former foster care children; one PE period per pregnancy per a 12-month period; remove the state
      as a qualified entity; and eliminate the ability for qualified providers to determine eligibility for Parents/Caretaker
      Relatives and Former Foster Care Children.
    topics:
    - Disaster Relief
    - Eligibility
    link_label: Approval Document
