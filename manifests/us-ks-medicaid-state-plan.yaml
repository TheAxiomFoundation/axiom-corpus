    effective_date: '2023-04-01'
    summary: CMS is approving this time-limited state plan amendment to allow the state to implement temporary policies while
      returning to normal operations after the COVID-19 national emergency. The purpose of this amendment is to temporarily
      implement a disregard of income that would have otherwise been part of an individual’s liability for institutional or
      home and community-based waiver services based on application of the post-eligibility treatment-of income (PETI) rules,
      but which became countable resources on or after March 18, 2020.
