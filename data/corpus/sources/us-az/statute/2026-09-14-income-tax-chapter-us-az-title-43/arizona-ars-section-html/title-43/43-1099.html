<p><font color=GREEN>43-1099</font>. <font color=PURPLE><u>Applicability of article</u></font></p>

<p>This article applies only to residents of states which do not have a current reciprocal income tax exemption agreement with this state pursuant to section 42-1005, subsection B. </p>
