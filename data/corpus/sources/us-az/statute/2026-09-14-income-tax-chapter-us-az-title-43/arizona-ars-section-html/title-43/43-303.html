<p><font color=GREEN>43-303</font>. <font color=PURPLE><u>Returns by agent or guardian</u></font></p>

<p>If the taxpayer is unable to make his own return, the return shall be made by a duly authorized agent or by the guardian or other person charged with the care of the person or property of the taxpayer. </p>
