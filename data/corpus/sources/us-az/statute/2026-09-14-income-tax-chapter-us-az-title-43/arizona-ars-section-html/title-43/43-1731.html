<p><font color=GREEN>43-1731.</font> <font color=PURPLE><u>Deductions</p>

<p></u></font>Deductions other than those deductions already reflected in the net amounts reported on the federal schedules prescribed in section 43-1701 may not be taken against Arizona small business adjusted gross income in computing Arizona small business taxable income. </p>
