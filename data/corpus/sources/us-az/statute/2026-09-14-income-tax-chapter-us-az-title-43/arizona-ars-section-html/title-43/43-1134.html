<p><font color=GREEN>43-1134</font>. <font color=PURPLE><u>Allocation of nonbusiness income</u></font></p>

<p>Rents and royalties from real or tangible personal property, capital gains, interest, dividends or patent or copyright royalties, to the extent that they constitute nonbusiness income, shall be allocated as provided in sections 43-1135 through 43-1138. </p>
