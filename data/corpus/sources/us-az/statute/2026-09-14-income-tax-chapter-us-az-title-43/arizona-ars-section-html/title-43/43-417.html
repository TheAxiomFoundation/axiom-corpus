<p><font color=GREEN>43-417</font>. <font color=PURPLE><u>Withholding without resort to legal action</u></font></p>

<p>Any person required to withhold and transmit any amount pursuant to this chapter shall comply with the requirement without resort to any legal or equitable action in a court of law or equity. </p>
