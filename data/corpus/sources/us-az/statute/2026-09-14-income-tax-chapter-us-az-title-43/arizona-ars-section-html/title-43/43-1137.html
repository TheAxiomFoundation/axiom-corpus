<p><font color=GREEN>43-1137</font>. <font color=PURPLE><u>Interest and dividends</u></font></p>

<p>Interest and dividends are allocable to this state if the taxpayer's commercial domicile is in this state unless the interest or dividend constitutes business income. </p>
