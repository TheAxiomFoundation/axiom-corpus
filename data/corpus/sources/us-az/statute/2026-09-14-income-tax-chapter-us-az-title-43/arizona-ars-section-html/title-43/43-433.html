<p><font color=GREEN>43-433</font>. <font color=PURPLE><u>Remedies for withheld taxes</u></font></p>

<p>Any taxpayer from whom a tax is collected by withholding under this chapter is entitled to the remedies set forth in chapter 6 of this title. </p>
