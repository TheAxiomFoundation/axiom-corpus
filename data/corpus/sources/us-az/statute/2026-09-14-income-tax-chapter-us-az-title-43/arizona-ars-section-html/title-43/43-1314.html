<p><font color=GREEN>43-1314</font>. <font color=PURPLE><u>Charge for estate or trust taxes upon estate or trust</u></font></p>

<p>Taxes on income of an estate or trust which is taxable to the estate or trust are a charge upon the estate or trust and shall be paid by the fiduciary. </p>
