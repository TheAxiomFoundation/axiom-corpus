<p><font color=GREEN>43-203</font>. <font color=PURPLE><u>Severability</u></font></p>

<p>If any provision of this title be held invalid, such invalidity shall not affect other provisions which can be given effect without the invalid provision and to this end the provisions of this title are declared to be severable. </p>
