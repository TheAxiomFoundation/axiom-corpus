<p><font color=GREEN>43-944</font>. <font color=PURPLE><u>Disclosure by department of basis of allocation</u></font></p>

<p>If the department reallocates income or deductions upon its examination of any return, it shall, upon the written request of the taxpayer, disclose to him the basis upon which its reallocation has been made. </p>
