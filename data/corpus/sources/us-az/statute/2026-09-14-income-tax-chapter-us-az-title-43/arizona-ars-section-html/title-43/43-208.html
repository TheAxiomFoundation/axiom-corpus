<p><font color=GREEN>43-208</font>. <font color=PURPLE><u>Administration and enforcement</u></font></p>

<p>The department shall administer and enforce this title. In addition to the administrative provisions of this title, title 42, chapter 1, article 3, including the civil and criminal penalties prescribed by sections 42-1125 and 42-1127, applies to this title. </p>
