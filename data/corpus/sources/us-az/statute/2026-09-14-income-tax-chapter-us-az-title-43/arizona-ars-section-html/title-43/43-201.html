<p><font color=GREEN>43-201</font>. <font color=PURPLE><u>Preemption by state of income taxation</u></font></p>

<p>The area of income taxation is preempted by the state, and a county, city, town or other political subdivision of this state shall not levy an income tax, so long as the urban revenue sharing fund is maintained as provided in section 43-206. </p>
