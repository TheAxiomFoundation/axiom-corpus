  <h2 style="color: #165857;"><span data-field="title" data-format="default">706-6 Special Rule for the IRS Match</span></h2>
  <p>The IRS match reports must be verified before you base ineligibility referrals on them.  DO NOT refer any ineligible CHIP case which is based only on an unverified IRS match report.</p>
