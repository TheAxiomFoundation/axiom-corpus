        <h1><a name="kanchor122"></a>Asset Limits for Workers with Disabilities </h1>
        <h1>510-05-57-19 </h1>
        <p style="font-weight: bold;">(Revised 8/1/05 ML2981)</p>
        <p class="bold" style="font-weight: normal;"><a title="Hyperlink to the archive page for this policy section." href="Archived Documents/archive.htm#510_05_57_19" target="_blank" alt="Hyperlink to the archive page for this policy section.">View Archives</a>
        </p>
        <p class="bold">&#160;</p>
        <p class="bold">&#160;</p>
        <p class="bold" style="font-weight: normal;">The medically needy asset limits apply 
 except that each Workers with Disabilities recipient in the Medicaid unit 
 is allowed an additional $10,000 in assets.</p>
        <p class="bold">&#160;</p>
